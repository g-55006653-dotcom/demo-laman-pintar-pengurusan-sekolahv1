<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Demo Laman Pintar Pengurusan Sekolah: pentadbiran, kurikulum, HEM dan kokurikulum dengan data rekaan.">
<title>Demo Laman Pintar Pengurusan Sekolah</title>
</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Susun atur: skrin penuh — banner nipis boleh diubah suai, menu sisi boleh kuncup, kandungan grid 12 lajur */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#101a33; --ink-2:#47526d; --muted:#737d95; --line:#e2e7f0;
  --accent:#2f5bea; --accent-soft:#e8eefe; --navy:#14213d; --navy-ink:#f3f6ff; --navy-2:#24345c;
  --s1:#2a78d6; --s2:#eb6834;
  --good:#12875a; --good-soft:#e3f5ec; --warn:#a96b00; --warn-soft:#fdf2dc; --bad:#d13b3b; --bad-soft:#fde8e8;
  --t1:#e4f1e1; --t2:#cfe6c8; --t3:#b6d8ab;
  --shadow:0 1px 2px rgba(16,26,51,.05),0 4px 14px rgba(16,26,51,.05);
  --f-body:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1222; --surface:#141c30; --surface-2:#1a2339; --ink:#eef1f8; --ink-2:#b4bdd2; --muted:#8f99b1; --line:#263150;
  --accent:#7d9bff; --accent-soft:#1d2a55; --navy:#0a1020; --navy-ink:#eef1f8; --navy-2:#1c2848;
  --s1:#3987e5; --s2:#d95926;
  --good:#3cc28a; --good-soft:#123426; --warn:#e3a33a; --warn-soft:#3a2b0c; --bad:#f07272; --bad-soft:#3c1717;
  --t1:#16301f; --t2:#1d3d27; --t3:#245030;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1222; --surface:#141c30; --surface-2:#1a2339; --ink:#eef1f8; --ink-2:#b4bdd2; --muted:#8f99b1; --line:#263150;
  --accent:#7d9bff; --accent-soft:#1d2a55; --navy:#0a1020; --navy-ink:#eef1f8; --navy-2:#1c2848;
  --s1:#3987e5; --s2:#d95926;
  --good:#3cc28a; --good-soft:#123426; --warn:#e3a33a; --warn-soft:#3a2b0c; --bad:#f07272; --bad-soft:#3c1717;
  --t1:#16301f; --t2:#1d3d27; --t3:#245030;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:13.5px;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:auto 1fr;grid-template-areas:"top top" "tick tick" "side main"}

/* Banner */
.top{grid-area:top;position:relative;isolation:isolate;background:var(--navy);color:var(--navy-ink);display:flex;align-items:center;gap:14px;overflow:hidden;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top::before{content:"";position:absolute;inset:0;z-index:-1;background-image:var(--banner,none);background-size:cover;background-position:center;opacity:var(--banner-op,.35)}
.top::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(10,16,32,.55),rgba(10,16,32,.15))}
.crest{width:46px;height:46px;border-radius:12px;background:linear-gradient(160deg,#ffd35a,#f0a500);display:grid;place-items:center;color:#14213d;font-weight:700;font-size:12px;flex:none;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:contain;background:#fff}
.brand{min-width:0}
.brand b{display:block;font-size:18px;letter-spacing:.2px;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.brand span{font-size:11.5px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.pill-dt{border:1px solid rgba(255,255,255,.28);background:rgba(10,16,32,.35);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.who{text-align:right;line-height:1.2}
.who b{font-size:13px;display:block}.who span{font-size:10.5px;letter-spacing:.8px;opacity:.75}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(36,52,92,.75);color:var(--navy-ink);display:grid;place-items:center;flex:none}
.ibtn:hover{background:var(--accent)}
.login-btn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:var(--navy-ink);border-radius:10px;padding:8px 14px;font-weight:600;display:flex;gap:8px;align-items:center;white-space:nowrap}
.login-btn:hover{background:var(--accent)}
.menu-btn{display:none}
.tick{grid-area:tick;display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--line);overflow:hidden;min-width:0}
.tick .lbl{background:var(--bad);color:#fff;font-weight:700;font-size:11px;letter-spacing:.8px;padding:8px 14px;white-space:nowrap;padding-left:max(16px,env(safe-area-inset-left,0px))}
.tick .track{overflow:hidden;flex:1;min-width:0}
.tick .run{display:inline-flex;gap:34px;white-space:nowrap;animation:run 50s linear infinite;padding-left:20px;font-size:12.5px}
.tick .run em{font-style:normal;color:var(--accent);font-weight:600;margin-right:6px}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tick .run{animation:none}}

/* Menu sisi */
.side{grid-area:side;width:250px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:10px 10px 24px;transition:width .2s;padding-left:max(10px,env(safe-area-inset-left,0px))}
.side .grp{font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.side .grp svg{width:12px;height:12px}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:8px 10px;border-radius:9px;text-align:left;color:var(--ink-2);font-size:13px;white-space:nowrap}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav svg.i{color:var(--ic,var(--muted))}
.nav.on{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 0 0 1.5px var(--accent),0 6px 16px rgba(47,91,234,.18)}
.side .fold{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;font-size:10.5px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px;text-align:left}
.side .fold:hover{color:var(--ink)}
.side .fold .chev{margin-left:auto;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);transition:transform .2s}
.side .fold .chev svg{width:14px;height:14px}
.side .fold.open .chev{transform:rotate(180deg)}
.side .sub-items{padding-left:6px;border-left:2px solid var(--line);margin-left:16px}
.app.mini .side .fold{font-size:0;padding:8px 0 4px;justify-content:center;border-top:1px solid var(--line);margin-top:6px}
.app.mini .side .fold .chev{display:none}
.app.mini .side .sub-items{padding:0;border:0;margin:0}
.app.mini .side{width:64px}
.app.mini .side .grp{font-size:0;padding:10px 0 4px;border-top:1px solid var(--line);margin:6px 8px 0}
.app.mini .side .grp svg{display:none}
.app.mini .nav span{display:none}
.app.mini .nav{justify-content:center}

.main{grid-area:main;overflow-y:auto;min-width:0;padding-block:18px 48px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h1{font-size:21px;margin:0;line-height:1.2;text-wrap:balance}
.ph p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.ph .sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:1380px){.c2{grid-column:span 4}.c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c7,.c8{grid-column:span 12}.c9{grid-column:span 8}}
@media (max-width:1100px){.c9,.c6{grid-column:span 12}}
@media (max-width:820px){.grid>*{grid-column:span 12!important}.grid>.c2{grid-column:span 6!important}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h3{margin:0;font-size:13.5px;font-weight:600}
.card .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ch .sp{flex:1}
.kpi{display:flex;flex-direction:column;gap:6px;padding:14px 16px}
.kpi .k{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1}
.kpi .d{font-size:11.5px;color:var(--ink-2)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .lab{fill:var(--ink);font-weight:600}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--navy);color:var(--navy-ink);padding:7px 10px;border-radius:8px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.2);line-height:1.5}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good,.st-Aktif,.st-Selesai,.st-Hadir,.st-Selesai{color:var(--good);background:var(--good-soft)}
.chip.warn,.st-Pindah,.st-Disahkan,.st-Ditempah,.st-Dalam{color:var(--warn);background:var(--warn-soft)}
.chip.bad,.st-Belum,.st-Baru,.st-Tidak{color:var(--bad);background:var(--bad-soft)}
.chip.acc,.st-Cadangan{color:var(--accent);background:var(--accent-soft)}
.st-Tamat{color:var(--muted);background:var(--surface-2)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);vertical-align:bottom}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.nw,th.nw{white-space:nowrap}
.r{text-align:right}.c{text-align:center}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--accent-soft)}
.mtag{display:inline-block;font-size:10px;font-weight:700;color:#c92a2a;background:#ffe3e3;border-radius:5px;padding:1px 5px;line-height:1.4;vertical-align:middle}.mtag.sm{font-size:9.5px;padding:0 4px}
.tkcal{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tkh{display:grid;grid-template-columns:52px repeat(7,1fr);background:var(--surface-2);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;text-align:center}.tkh>div{padding:8px 0}
.tkw{display:grid;grid-template-columns:52px repeat(7,1fr);border-top:1px solid var(--line);min-height:96px;position:relative;column-gap:0}
.tkm{display:flex;justify-content:center;align-items:flex-start;padding-top:8px;border-right:1px solid var(--line);background:var(--surface-2)}
.tkd{border-left:1px solid var(--line);padding:4px 6px;font-size:12px;color:var(--ink-2);cursor:default;min-height:94px}.tkd:first-of-type{border-left:0}
.tkd b{font-weight:600}.tkd.luar{color:var(--muted);opacity:.55}.tkd.hujung{background:var(--surface-2)}.tkd.cuti{background:#fff0f1}.tkd.kini b{background:var(--accent);color:#fff;border-radius:999px;padding:1px 6px}
.tkbar{position:relative;z-index:1;margin:2px 3px 0;border:0;border-radius:6px;background:var(--c);color:#fff;font:600 11px/1.3 inherit;font-family:inherit;padding:3px 7px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;align-self:start}.tkbar:hover{filter:brightness(1.08)}.tkbar.sambung{border-top-left-radius:0;border-bottom-left-radius:0}
.tkw>.tkbar{grid-row-start:auto}
.tkmx{border-collapse:separate;border-spacing:0;min-width:820px;table-layout:fixed;width:100%}.tkmx th:first-child,.tkmx td.tkt{width:110px}.tkmx th{text-align:center;background:var(--surface);position:sticky;top:0;z-index:1}.tkmx th:first-child{text-align:left}.tkmx .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.tkmx td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top;padding:5px;height:38px}.tkmx td.tkt{border-left:0;white-space:nowrap;width:96px}.tkmx td.tkt small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.5px}
.tkmx tr.hujung td{background:var(--surface-2)}.tkmx tr.cuti td{background:#fff0f1}.tkmx tr.kini td.tkt{box-shadow:inset 3px 0 0 var(--accent)}
.tkc.tambah{cursor:cell}.tkc.tambah:hover{background:var(--accent-soft)}
.tkchip{display:block;width:100%;border:0;border-radius:6px;background:var(--c);color:#fff;font:600 11px/1.3 inherit;font-family:inherit;padding:4px 7px;text-align:left;margin-bottom:3px;cursor:pointer}.tkchip small{display:block;font-weight:400;opacity:.85;font-size:10px}
.tkmx-w{max-height:640px;overflow:auto}
.paper .tkmx{min-width:0;font-size:9px}.paper .tkmx td{height:auto;padding:2px}.paper .tkchip{font-size:8.5px;padding:1px 3px}
.tbE th,.tbE td{text-align:center;border:1px solid var(--line);padding:7px 8px;font-variant-numeric:tabular-nums}
.tbE th{vertical-align:middle;color:var(--ink-2);background:var(--surface-2)}
.tbE .l{text-align:left;font-weight:600;white-space:nowrap}
.tbE .jum{background:var(--accent-soft);font-weight:700}
.tbE th.sm{font-size:9.5px;letter-spacing:.2px;padding:5px 4px;line-height:1.2}
.tbE .ag{background:var(--good-soft);font-weight:600}
.tbE tr.subt td{background:var(--surface-2);font-weight:700}
.tbE tr.tot td{font-weight:800}
.sc{max-height:calc(100vh - 290px);max-height:calc(100dvh - 290px);min-height:320px;overflow:auto;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px}
.sc table{border-collapse:separate;border-spacing:0}
/* baris tajuk (Kelas · hari · Purata minggu) dan lajur kelas kekal kelihatan semasa skrol; baris Sekolah kekal di bawah */
.sc thead th{position:sticky;top:0;z-index:3;background:var(--surface);box-shadow:inset 0 -2px 0 var(--line)}
.sc tbody td:first-child,.sc tfoot td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:inset -1px 0 0 var(--line)}
.sc thead th:first-child{left:0;z-index:4;box-shadow:inset 0 -2px 0 var(--line),inset -1px 0 0 var(--line)}
.sc tfoot td{position:sticky;bottom:0;z-index:2;background:var(--surface-2);box-shadow:inset 0 2px 0 var(--line)}
.sc tfoot td:first-child{z-index:3;background:var(--surface-2)}
.sc table{min-width:640px}.sc th.c,.sc td.c{text-align:center}.sc th.kini{color:var(--accent)}
.sc-c{text-align:center;cursor:pointer;line-height:1.25;border-left:4px solid var(--w,transparent);background:color-mix(in srgb,var(--w,transparent) 9%,transparent)}
.sc-c b{display:block;font-size:13px}.sc-c span{font-size:12px;font-weight:700;color:var(--w)}.sc-c:hover{outline:2px solid var(--accent);outline-offset:-2px}
.sc-c.on{outline:2px solid var(--accent);outline-offset:-2px;background:var(--accent-soft)}.sc-c.kosong{color:var(--muted);background:var(--surface-2)}.sc-c.depan{cursor:default;background:transparent}
.sc-c.cuti{cursor:default;color:var(--muted);font-size:11px;background:repeating-linear-gradient(45deg,var(--surface-2) 0 6px,transparent 6px 12px)}.sc-p small{display:block;color:var(--muted);font-size:11px}
.sc-ganti{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}.sc-ganti input{width:17px;height:17px}
.meter{display:flex;align-items:center;gap:8px}
.meter .b{flex:1;height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:50px}
.meter .b i{display:block;height:100%;border-radius:4px}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none;object-fit:cover;vertical-align:middle;background:#5b6b93}
.nm{display:flex;align-items:center;gap:10px}
.nm small{display:block;color:var(--muted);font-size:11px}
.mono{font-family:var(--f-mono);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.in{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;min-width:0;max-width:100%}
.in:focus{border-color:var(--accent);outline:none}
textarea.in{width:100%;min-height:90px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;font-weight:600;font-size:12.5px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--bad)}.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2);min-width:0}
.form label .in{font-weight:400;width:100%}
@media (max-width:640px){.form{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:500;font-size:12.5px;color:var(--ink-2)}
.seg button.on{background:var(--accent);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.note{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.6}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:12.5px}
.ev{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ev:last-child{border-bottom:0}
.ev .dt{width:46px;flex:none;text-align:center;border-radius:9px;background:var(--accent-soft);color:var(--accent);padding:4px 0;line-height:1.15}
.ev .dt b{display:block;font-size:16px}.ev .dt span{font-size:10px;font-weight:600;text-transform:uppercase}

function normH_(s) { return String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function normIC_(v) { return String(v == null ? '' : v).replace(/\D/g, ''); }

function cyrb53_(str, seed) {
  var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
  for (var i = 0, ch; i < str.length; i++) { ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);

function bars(el, cats, series, h = 240) {
  if (!el) return;
  const W = el.clientWidth || 400, m = { t: 22, r: 8, b: 26, l: 34 }, iw = W - m.l - m.r, ih = h - m.t - m.b;
  const tot = cats.map((_, i) => series.reduce((s, x) => s + x.vals[i], 0)), mx0 = Math.max(1, ...tot);
  const mag = Math.pow(10, Math.floor(Math.log10(mx0))), stepV = mx0 / mag < 3 ? mag / 2 : mag, max = Math.ceil(mx0 / stepV) * stepV;
  const y = v => m.t + ih - v / max * ih, step = iw / cats.length, bw = Math.min(48, step * .58);
  let s = `<svg viewBox="0 0 ${W} ${h}" height="${h}" role="img">`;
  for (let v = 0; v <= max + 1e-9; v += stepV) s += `<line class="grid-l" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${+v.toFixed(1)}</text>`;
  cats.forEach((c, i) => {
    const x = m.l + step * i + (step - bw) / 2; let acc = 0;
    series.forEach((sr, k) => { const v = sr.vals[i]; if (!v) return; const y0 = y(acc), y1 = y(acc + v), last = series.slice(k + 1).every(z => !z.vals[i]); const hh = Math.max(0, y0 - y1 - (k > 0 ? 2 : 0));
      s += last ? `<path d="M${x},${y1 + hh} V${y1 + Math.min(4, hh)} q0,-4 4,-4 H${x + bw - 4} q4,0 4,4 V${y1 + hh}Z" fill="${sr.color}"/>` : `<rect x="${x}" y="${y1}" width="${bw}" height="${hh}" fill="${sr.color}"/>`; acc += v; });
    s += `<text class="lab num" x="${x + bw / 2}" y="${y(tot[i]) - 6}" text-anchor="middle">${tot[i]}</text><text x="${x + bw / 2}" y="${h - 8}" text-anchor="middle">${esc(c)}</text><rect data-i="${i}" x="${m.l + step * i}" y="${m.t}" width="${step}" height="${ih}" fill="transparent"/>`;
  });
  el.innerHTML = s + '</svg>';
  $$('rect[data-i]', el).forEach(r => { r.onmousemove = e => { const i = +r.dataset.i; showTip(`<b>${esc(cats[i])}</b><br>${series.map(sr => `${esc(sr.name)}: <b class="num">${sr.vals[i]}</b>`).join('<br>')}${series.length > 1 ? `<br>Jumlah: <b class="num">${tot[i]}</b>` : ''}`, e); }; r.onmouseleave = hideTip; });
}

/* Jadual enrolmen terperinci (kelas x kaum x jantina) dan agama x kaum x jantina */
function enrolTerperinci(r) {
  const e = $('#enrolT'), a = $('#agamaT'); if (!e || !a) return;
  const K = r.kaum, SUB = ['LI', 'LB', 'PI', 'PB'], z = () => ({ L: 0, P: 0, LI: 0, LB: 0, PI: 0, PB: 0 }), sum = (o, k) => Object.assign(z(), o[k] || {});
  const add = (acc, kaum) => K.forEach(k => { acc[k] = acc[k] || z(); const v = sum(kaum, k); Object.keys(acc[k]).forEach(x => acc[k][x] += v[x]); });
  const jum = kaum => K.reduce((s, k) => { const v = sum(kaum, k); Object.keys(s).forEach(x => s[x] += v[x]); return s; }, z());
  /* Jadual kelas: setiap kaum dipecah Lelaki / Perempuan, kemudian Islam / Bukan Islam */
  const headK = `<thead><tr><th rowspan="3" class="l">KELAS</th>${K.map(k => `<th colspan="4">${esc(k.toUpperCase())}</th>`).join('')}<th colspan="2" rowspan="2" class="jum">JUMLAH</th><th colspan="2" rowspan="2" class="ag">AGAMA</th><th rowspan="3" class="jum">JUMLAH<br>BESAR</th></tr>
    <tr>${K.map(() => '<th colspan="2">LELAKI</th><th colspan="2">PEREMPUAN</th>').join('')}</tr>
    <tr>${K.map(() => '<th class="sm">ISLAM</th><th class="sm">BUKAN<br>ISLAM</th><th class="sm">ISLAM</th><th class="sm">BUKAN<br>ISLAM</th>').join('')}<th class="jum">L</th><th class="jum">P</th><th class="ag">ISLAM</th><th class="ag">BUKAN<br>ISLAM</th></tr></thead>`;
  const rowK = (label, kaum, cls) => { const t = jum(kaum);
    return `<tr class="${cls || ''}"><td class="l">${label}</td>${K.map(k => { const v = sum(kaum, k); return SUB.map(x => `<td>${v[x]}</td>`).join(''); }).join('')}<td class="jum">${t.L}</td><td class="jum">${t.P}</td><td class="ag">${t.LI + t.PI}</td><td class="ag">${t.LB + t.PB}</td><td class="jum"><b>${t.L + t.P}</b></td></tr>`; };
  const tahun = [...new Set(r.kelas.map(c => c.tahun))], all = {}; let body = '';
  tahun.forEach(t => { const xs = r.kelas.filter(c => c.tahun === t), sub = {}; xs.forEach(c => { body += rowK(esc(c.kelas), c.kaum); add(sub, c.kaum); add(all, c.kaum); }); if (xs.length > 1) body += rowK('Jumlah ' + esc(tahunLabel(t)), sub, 'subt'); });
  e.innerHTML = e.querySelector('.ch').outerHTML + `<div class="tw"><table class="tbE">${headK}<tbody>${body || `<tr><td colspan="${K.length * 4 + 6}" class="empty">Tiada murid aktif.</td></tr>`}</tbody><tfoot>${rowK('JUMLAH KESELURUHAN', all, 'tot')}</tfoot></table></div>`;
  /* Jadual agama x kaum x jantina (kekal) */
  const headA = `<thead><tr><th rowspan="2" class="l">AGAMA</th>${K.map(k => `<th colspan="2">${esc(k.toUpperCase())}</th>`).join('')}<th colspan="2" class="jum">JUMLAH</th><th rowspan="2" class="jum">JUMLAH<br>BESAR</th></tr><tr>${K.concat(['']).map((k, i) => `<th class="${i === K.length ? 'jum' : ''}">L</th><th class="${i === K.length ? 'jum' : ''}">P</th>`).join('')}</tr></thead>`;
  const rowA = (label, kaum, cls) => { const t = jum(kaum); return `<tr class="${cls || ''}"><td class="l">${label}</td>${K.map(k => `<td>${sum(kaum, k).L}</td><td>${sum(kaum, k).P}</td>`).join('')}<td class="jum">${t.L}</td><td class="jum">${t.P}</td><td class="jum"><b>${t.L + t.P}</b></td></tr>`; };
  const allA = {}; let bodyA = ''; r.agama.forEach(g => { bodyA += rowA(esc(g), r.agamaKaum[g]); add(allA, r.agamaKaum[g]); });
  a.innerHTML = a.querySelector('.ch').outerHTML + `<div class="tw"><table class="tbE">${headA}<tbody>${bodyA}</tbody><tfoot>${rowA('JUMLAH', allA, 'tot')}</tfoot></table></div>`;
}

    + `<div class="card">${chart()}</div>`;
  const ed = $('#wEdit'); if (ed) ed.onclick = () => { ST.wargaEdit = !ST.wargaEdit; reload(); };
  const imp = $('#wImp'); if (imp) imp.onclick = async () => { const n = await act(() => call('wargaImport')); toast(`${n} nama ditambah daripada senarai guru.`); reload(); };
  $('#wView').onclick = () => { showPrint(paperHead('CARTA ORGANISASI WARGA SEKOLAH', 'SESI ' + ST.boot.settings.sesi) + `<div class="title">CARTA ORGANISASI ${esc(ST.boot.settings.namaSekolah.toUpperCase())}</div>` + chart().replace(/<div class="acts">[\s\S]*?<\/div>/g, '')); };
  const fields = [{ f: 'kumpulan', l: 'Kumpulan', t: 'select', opts: KUMP }, { f: 'nama', l: 'Nama', req: 1 }, { f: 'jawatan', l: 'Jawatan', req: 1 }, { f: 'susunan', l: 'Susunan paparan', t: 'number' }];
  const edit1 = r => formModal(r.id ? 'Sunting ahli' : 'Tambah ahli', fields, r, async o => { o.id = r.id; o.foto = r.foto || ''; await act(() => call('wargaSave', { row: o }), 'Maklumat berjaya disimpan.'); reload(); },
    { del: r.id ? async () => { await act(() => call('wargaDel', { id: r.id }), 'Nama dibuang daripada carta.'); closeModal(); reload(); } : null });

  // Kad besar: susunan ikut paparan carta supaya butang sebelum/seterusnya mengikut carta
  const urutan = $$('[data-wv]', m).map(x => x.dataset.wv);

    const isi = async () => { const L = await call('cartaJawatan', { bahagian: d.querySelector('#wkB').value }), u = {};

      + `<div class="card" style="margin-bottom:16px"><div class="tools">${sel('fB', bulanOpts, f.bulan)}${sel('fT', [['', 'Semua tahun'], ...tahunSet.map(t => [t, tahunLabel(t)])], f.tahun)}${sel('fK', [['', 'Semua kelas'], ...ST.boot.kelas.filter(k => f.tahun === '' || String(k.tahun) === String(f.tahun)).map(k => [k.kelas, k.kelas])], f.kelas)}<span class="sub">${f.bulan ? 'Kiraan bulan ini sahaja (bermula semula setiap bulan)' : 'Jumlah semua bulan dalam sesi'}</span></div></div>
      <div class="grid"><div class="card c12"><div class="ch"><div><h3>Analisis perekodan NILAM</h3><div class="sub">${f.bulan ? ymLabel(f.bulan) : 'Kumulatif tahunan ' + sesi}</div></div></div><div class="tw"><table><thead><tr><th>Tahun</th><th class="r">Jum. murid</th><th class="r" style="color:var(--accent)">Jum. bahan</th>${NJ.map(x => `<th class="r">${x}</th>`).join('')}${['BM', 'BI', 'Lain-lain bahasa'].map(x => `<th class="r">${x}</th>`).join('')}<th class="r">Purata / murid</th></tr></thead>
        <tbody>${r.kumpulan.map(g => `<tr><td class="nw"><b>${tahunLabel(g.tahun).toUpperCase()}</b></td><td class="r num">${g.murid}</td><td class="r num"><b style="color:var(--accent)">${g.jumlah}</b></td>${NJ.map(x => `<td class="r num">${g.jenis[x] || 0}</td>`).join('')}${NB.map(x => `<td class="r num">${g.bahasa[x] || 0}</td>`).join('')}<td class="r num">${g.murid ? (g.jumlah / g.murid).toFixed(1) : '0.0'}</td></tr>`).join('')}</tbody>
        <tfoot><tr><td>JUMLAH KESELURUHAN</td><td class="r num">${T.murid}</td><td class="r num">${T.jumlah}</td>${NJ.concat(NB).map(x => `<td class="r num">${T[x] || 0}</td>`).join('')}<td class="r num">${T.murid ? (T.jumlah / T.murid).toFixed(1) : '0.0'}</td></tr></tfoot></table></div></div>
      <div class="card c6"><h3>Jumlah bacaan mengikut kumpulan</h3><div class="sub" style="margin-bottom:8px">${f.bulan ? ymLabel(f.bulan) : 'Kumulatif ' + sesi}</div>${T.jumlah ? '<div class="chart" id="nChart"></div>' : '<div class="empty">Tiada data bacaan untuk tempoh ini.</div>'}</div>
      <div class="card c3"><h3>${ico('trophy')} 10 pembaca terbanyak</h3><div style="margin-top:8px">${r.top.map((t, i) => `<div class="ev"><div class="dt" style="width:30px"><b class="num">${i + 1}</b></div><div class="tx">${esc(t.nama)}<small>${esc(t.kelas)} · <b class="num">${t.jumlah}</b> bahan</small></div></div>`).join('') || '<div class="empty">Tiada pembaca direkodkan.</div>'}</div></div>
      <div class="card c3"><h3>Taburan bintang</h3><div class="sub" style="margin-bottom:8px">Kumulatif tahunan ${sesi}</div>${r.bintang.slice().reverse().map(b => `<div class="meter" style="margin:9px 0"><span style="width:92px;font-size:12px">${'★'.repeat(b.bintang)}</span><span style="flex:1;font-size:12px;color:var(--muted)">${esc(b.label)}</span><b class="num">${b.bil}</b></div>`).join('')}</div></div>`;
    if (T.jumlah) bars($('#nChart'), r.kumpulan.map(g => tahunLabel(g.tahun)), [{ name: 'Jumlah bahan', color: cssv('--s1'), vals: r.kumpulan.map(g => g.jumlah) }], 240);
    $('#fB').onchange = e => { f.bulan = e.target.value; reload(); }; $('#fT').onchange = e => { f.tahun = e.target.value; f.kelas = ''; reload(); }; $('#fK').onchange = e => { f.kelas = e.target.value; reload(); };
    const nt = $('#nTutup'); if (nt) nt.onclick = () => { ST.nSaya = ''; reload(); };
  } else {
    const f = ST.nR = ST.nR || { kelas: '', bulan: today().slice(0, 7) };
    const rows = await call('nilamRekod', f);
    body.innerHTML = `<div class="card"><div class="tools" style="margin-bottom:12px">${sel('rK', kelasOpts(), f.kelas)}<input class="in" type="month" id="rB" value="${f.bulan}"><span class="sub">${rows.length} rekod (maksimum 300 dipaparkan)</span></div><div class="tw"><table><thead><tr><th>Tarikh</th><th>Murid</th><th>Kelas</th><th>Tajuk</th><th>Jenis</th><th>Bahasa</th><th>Aktiviti pengayaan</th><th>Direkod oleh</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td class="nw">${fmtD(r.tarikh)}</td><td>${esc(r.nama)}</td><td class="nw">${esc(r.kelas)}</td><td>${esc(r.tajuk)}<br><small style="color:var(--muted)">${esc(r.penulis)}</small></td><td>${esc(r.jenis)}</td><td>${esc(r.bahasa)}</td><td>${esc(r.aktiviti)}${r.ulasan ? `<br><small style="color:var(--muted)">${esc(r.ulasan)}</small>` : ''}</td><td>${esc(r.oleh)}</td><td><button class="btn sm danger" data-d="${r.id}" aria-label="Padam">${ico('trash')}</button></td></tr>`).join('') || '<tr><td colspan="9" class="empty">Tiada rekod.</td></tr>'}</tbody></table></div></div>`;
    $('#rK').onchange = e => { f.kelas = e.target.value; reload(); }; $('#rB').onchange = e => { f.bulan = e.target.value; reload(); };
    $$('[data-d]', body).forEach(b => b.onclick = async () => { if (await confirmBox('Padam rekod bacaan ini?', 'Padam')) { await act(() => call('nilamDel', { id: b.dataset.d }), 'Rekod dipadam.'); reload(); } });
  }
};

/* ---------- Pencerapan ---------- */
PAGES.pencerapan = async m => {
  const r = await call('pencerapan', {}), sesi = ST.boot.settings.sesi; ST.pTab = ST.pTab || 'kalendar'; ST.ymP = ST.ymP || today().slice(0, 7);
  const g = await guruList(), pentadbir = g.filter(x => ['PENTADBIR', 'ADMIN', 'SUPERADMIN'].includes(x.peranan));
  const fields = () => [{ f: 'fasa', l: 'Fasa', t: 'select', opts: [['1', 'Fasa 1'], ['2', 'Fasa 2']] }, { f: 'tarikh', l: 'Tarikh', t: 'date', req: 1 }, { f: 'masa', l: 'Masa', t: 'time' }, { f: 'kelas', l: 'Kelas', t: 'kelas', req: 1 }, { f: 'subjek', l: 'Mata pelajaran', req: 1 },
    ...(r.bolehNilai ? [{ f: 'guru', l: 'Nama guru', t: 'select', opts: g.map(x => x.nama) }, { f: 'pencerap', l: 'Pencerap', t: 'select', opts: ['', ...pentadbir.map(x => x.nama)] }, { f: 'status', l: 'Status', t: 'select', opts: ['Cadangan', 'Disahkan', 'Selesai'] }, { f: 'markah', l: 'Markah pencerapan (%)', t: 'number' }, { f: 'kbat', l: 'Skor ISPPK (KBAT)', ph: 'Contoh: 4 atau 80%' }, { f: 'catatan', l: 'Catatan pencerap', t: 'textarea' }] : [])];
  const bilMuridNote = d => { const k = d.querySelector('#f_kelas'), out = d.querySelector('#bilM'); const upd = async () => { const ms = await muridList(); out.textContent = k.value ? `${ms.filter(x => x.kelas === k.value && /^aktif$/i.test(x.status)).length} murid dalam ${k.value} (diambil automatik daripada Database Induk)` : ''; }; k.onchange = upd; upd(); };
  const edit = row => {
    const mine = !row.id || row.milikSaya, can = r.bolehNilai || (mine && (!row.status || row.status === 'Cadangan'));
    if (!can) return openModal(`<h2>Pencerapan ${esc(row.guru)}</h2><dl class="kv2" style="display:grid;grid-template-columns:120px 1fr;gap:6px"><dt>Tarikh</dt><dd>${fmtDL(row.tarikh)} ${esc(row.masa)}</dd><dt>Kelas</dt><dd>${esc(row.kelas)} (${row.bilMurid} murid)</dd><dt>Mata pelajaran</dt><dd>${esc(row.subjek)}</dd><dt>Fasa</dt><dd>${row.fasa}</dd><dt>Status</dt><dd>${chip(row.status, 'st-' + row.status)}</dd></dl><div class="foot"><button class="btn" onclick="closeModal()">Tutup</button></div>`);
    if (!row.id) { row.fasa = row.fasa || (today() <= `${sesi}-06-30` ? '1' : '2'); if (r.bolehNilai) row.guru = row.guru || g[0].nama; }
    formModal(row.id ? 'Kemas kini pencerapan' : (r.bolehNilai ? 'Jadual pencerapan baharu' : 'Cadangan tarikh pencerapan'), fields(), row, async o => { o.id = row.id; await act(() => call('pencerapanSave', { row: o }), 'Pencerapan berjaya disimpan.'); reload(); },
      { wide: r.bolehNilai, pre: r.bolehNilai ? '' : `<div class="note" style="margin-bottom:12px">Cadangan anda akan disemak dan disahkan oleh pentadbir. Markah dan skor ISPPK hanya dilihat oleh pencerap.</div>`, bind: d => { d.querySelector('.form').insertAdjacentHTML('afterend', '<div class="sub" id="bilM" style="margin-top:8px"></div>'); bilMuridNote(d); },
        del: row.id ? async () => { await act(() => call('pencerapanDel', { id: row.id }), 'Tempahan dibatalkan.'); closeModal(); reload(); } : null });
  };
  const sk = f => { const n = r.skor.length, s = r.skor.filter(x => x[f] === 'Selesai').length; return { n, s, p: n ? Math.round(s / n * 100) : 0 }; };
  const k1 = sk('f1'), k2 = sk('f2');
  const tabs = [['kalendar', 'Kalendar tempahan'], ['skor', 'Skorkad penyelesaian'], ['senarai', 'Senarai pencerapan']];
  m.innerHTML = head('Pencerapan Guru', `Sesi ${esc(sesi)} · ${r.bolehNilai ? 'Paparan pencerap: markah dan ISPPK (KBAT) dipaparkan' : 'Tempah tarikh pencerapan anda melalui kalendar'}`, `<button class="btn pri" id="pAdd">${ico('plus')}${r.bolehNilai ? 'Jadual baharu' : 'Cadang tarikh'}</button>`)
    + `<div class="grid" style="margin-bottom:16px"><div class="card kpi c3"><span class="k">Selesai Fasa 1</span><span class="v num">${k1.s}/${k1.n}</span><div class="meter"><span class="b"><i style="width:${k1.p}%;background:var(--good)"></i></span><b class="num">${k1.p}%</b></div></div>
      <div class="card kpi c3"><span class="k">Selesai Fasa 2</span><span class="v num">${k2.s}/${k2.n}</span><div class="meter"><span class="b"><i style="width:${k2.p}%;background:var(--good)"></i></span><b class="num">${k2.p}%</b></div></div>
      <div class="card kpi c3"><span class="k">Menunggu pengesahan</span><span class="v num">${r.rows.filter(x => x.status === 'Cadangan').length}</span><span class="d">Cadangan tarikh daripada guru</span></div>
      <div class="card kpi c3"><span class="k">Dijadualkan</span><span class="v num">${r.rows.filter(x => x.status === 'Disahkan').length}</span><span class="d">Telah disahkan, belum dicerap</span></div></div>`
    + `<div class="tabs">${tabs.map(([k, l]) => `<button data-t="${k}" class="${ST.pTab === k ? 'on' : ''}">${l}</button>`).join('')}</div><div id="pBody"></div>`;
  $$('.tabs button', m).forEach(b => b.onclick = () => { ST.pTab = b.dataset.t; reload(); });
  $('#pAdd').onclick = () => edit({ tarikh: today() });
  const body = $('#pBody');
  if (ST.pTab === 'kalendar') {
    const ev = {}; r.rows.forEach(x => (ev[x.tarikh] = ev[x.tarikh] || []).push({ id: x.id, cls: 'st-' + x.status, label: `${x.masa ? x.masa + ' ' : ''}${x.guru.split(' ').slice(0, 2).join(' ')} · ${x.kelas}` }));
    body.innerHTML = `<div class="card"><div class="ch"><button class="btn sm" id="cPrev" aria-label="Bulan sebelum">${ico('left')}</button><h3 style="align-self:center">${ymLabel(ST.ymP)}</h3><button class="btn sm" id="cNext" aria-label="Bulan seterusnya">${ico('right')}</button><div class="sp"></div><div class="legend"><span>${chip('Cadangan', 'st-Cadangan')}</span><span>${chip('Disahkan', 'st-Disahkan')}</span><span>${chip('Selesai', 'st-Selesai')}</span></div></div>${calendarHTML(ST.ymP, ev)}<div class="sub" style="margin-top:8px">Klik pada tarikh kosong untuk membuat tempahan.</div></div>`;
    $('#cPrev').onclick = () => { ST.ymP = ymShift(ST.ymP, -1); reload(); }; $('#cNext').onclick = () => { ST.ymP = ymShift(ST.ymP, 1); reload(); };
    $$('.cal [data-ev]', body).forEach(e => e.onclick = x => { x.stopPropagation(); edit(Object.assign({}, r.rows.find(y => y.id === e.dataset.ev))); });
    $$('.cal [data-day]', body).forEach(d => d.onclick = () => edit({ tarikh: d.dataset.day }));
  } else if (ST.pTab === 'skor') {
    const c = s => s === 'Selesai' ? 'good' : s === 'Ditempah' ? 'warn' : 'bad';
    body.innerHTML = `<div class="card"><div class="ch"><div><h3>Skorkad guru</h3><div class="sub">Hijau = selesai · Kuning = sudah ditempah · Merah = belum dicerap</div></div></div><div class="cardlist" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">${r.skor.map(x => `<div class="ccard" style="flex-direction:row;align-items:center;gap:10px">${ph('', x.nama)}<div style="min-width:0;flex:1"><b style="font-size:12px;display:block;line-height:1.3">${esc(x.nama)}</b><small style="color:var(--muted)">${esc(x.jawatan || '')}</small><div class="tools" style="margin-top:6px">${chip('Fasa 1: ' + x.f1, 'dot ' + c(x.f1))}${chip('Fasa 2: ' + x.f2, 'dot ' + c(x.f2))}</div></div></div>`).join('')}</div></div>`;
  } else {
    body.innerHTML = `<div class="card"><div class="tw"><table><thead><tr><th>Tarikh</th><th>Guru</th><th>Kelas</th><th class="r">Murid</th><th>Mata pelajaran</th><th>Fasa</th><th>Pencerap</th><th>Status</th>${r.bolehNilai ? '<th class="r">Markah</th><th>ISPPK (KBAT)</th>' : ''}<th></th></tr></thead><tbody>${r.rows.slice().sort((a, b) => String(b.tarikh).localeCompare(a.tarikh)).map(x => `<tr><td class="nw">${fmtD(x.tarikh)} ${esc(x.masa)}</td><td>${esc(x.guru)}</td><td class="nw">${esc(x.kelas)}</td><td class="r num">${x.bilMurid}</td><td>${esc(x.subjek)}</td><td>${x.fasa}</td><td>${esc(x.pencerap)}</td><td>${chip(x.status, 'st-' + x.status)}</td>${r.bolehNilai ? `<td class="r num">${esc(x.markah)}</td><td>${esc(x.kbat)}</td>` : ''}<td><button class="btn sm" data-e="${x.id}">${ico(r.bolehNilai || x.milikSaya ? 'edit' : 'eye')}</button></td></tr>`).join('') || `<tr><td colspan="11" class="empty">Belum ada pencerapan bagi sesi ini.</td></tr>`}</tbody></table></div></div>`;
    $$('[data-e]', body).forEach(b => b.onclick = () => edit(Object.assign({}, r.rows.find(y => y.id === b.dataset.e))));
  }
};

/* ---------- Enrolmen murid (kurikulum) ---------- */
PAGES.enrolmen = async m => {
  const rows = await call('enrolmen'), T = rows.reduce((a, r) => { a.murid += r.murid; a.pemulihan += r.pemulihan; a.pit1 += r.pit1; a.plan += +r.plan || 0; return a; }, { murid: 0, pemulihan: 0, pit1: 0, plan: 0 });
  const tahun = [...new Set(rows.map(r => r.tahun))];
  m.innerHTML = head('Enrolmen Murid', 'Murid aktif dikira daripada Database Induk · Pemulihan dan PIT1 dikira daripada senarai masing-masing', `<button class="btn pri" id="eSave">${ico('upload')}Simpan ke sheet ENROLMEN MURID</button>`)
    + `<div class="grid"><div class="card kpi c3"><span class="k">Murid aktif</span><span class="v num">${T.murid}</span></div><div class="card kpi c3"><span class="k">Murid pemulihan</span><span class="v num">${T.pemulihan}</span></div><div class="card kpi c3"><span class="k">Murid PLaN</span><span class="v num">${T.plan}</span></div><div class="card kpi c3"><span class="k">Murid PIT1</span><span class="v num">${T.pit1}</span></div>
      <div class="card c7"><div class="tw"><table><thead><tr><th>Kelas</th><th class="r">Murid</th><th class="r">Pemulihan</th><th class="r">PLaN</th><th class="r">PIT1</th></tr></thead><tbody>${rows.map(r => `<tr><td><b>${esc(r.kelas)}</b></td><td class="r num">${r.murid}</td><td class="r num">${r.pemulihan}</td><td class="r"><input class="in num" type="number" min="0" data-plan="${esc(r.kelas)}" value="${esc(r.plan)}" style="width:70px;text-align:right" aria-label="PLaN ${esc(r.kelas)}"></td><td class="r num">${r.pit1}</td></tr>`).join('')}</tbody><tfoot><tr><td>Jumlah</td><td class="r num">${T.murid}</td><td class="r num">${T.pemulihan}</td><td class="r num">${T.plan}</td><td class="r num">${T.pit1}</td></tr></tfoot></table></div></div>
      <div class="card c5"><h3>Enrolmen mengikut tahun</h3><div class="legend" style="margin:6px 0"><span><i style="background:var(--s1)"></i>Murid aktif</span></div><div class="chart" id="eC"></div><div class="note" style="margin-top:12px">Lajur PLaN diisi secara manual dan disimpan bersama apabila anda menekan Simpan.</div></div></div>`;
  bars($('#eC'), tahun.map(tahunLabel), [{ name: 'Murid aktif', color: cssv('--s1'), vals: tahun.map(t => rows.filter(r => r.tahun === t).reduce((s, r) => s + r.murid, 0)) }], 240);
  $('#eSave').onclick = async () => { const plan = {}; $$('[data-plan]', m).forEach(i => plan[i.dataset.plan] = i.value); const n = await act(() => call('enrolmenSimpan', { plan })); toast(`Enrolmen ${n} kelas berjaya disimpan.`); reload(); };
};
</script>

<script>

  ['DIGANTUNG SEKOLAH', ['Digantung Sekolah']],
  ['BENCANA', ['Pencemaran Udara', 'Kemarau', 'Cuaca Panas El Nino', 'Pencemaran Sisa Kimia', 'Pencemaran Alam', 'Tanah Runtuh', 'Gangguan Bekalan Air', 'Jerebu', 'Kemalangan', 'Banjir', 'Gempa Bumi', 'Hujan Lebat/Ribut Taufan']],
  ['ANCAMAN KESELAMATAN', ['Binatang Liar/Buas/Berbisa', 'Diculik', 'Gangguan Mistik/Makhluk Halus', 'Gangguan Kumpulan Kongsi Gelap', 'Kebakaran', 'Pengganas/Lanun', 'Rusuhan Di Luar Kawasan Sekolah', 'Ugutan Daripada Pihak Luar']],
  ['AKTIVITI LUAR SEKOLAH', ['Wakil Sekolah']]

const SEBAB_PISAH = ' — ';

/* Pemenang ikut peratus; jika seri, dipecah ikut markah Susun Atur Kelas & Hiasan, Lantai, kemudian Sudut Subjek */
const kecBanding = (a, b) => (b.peratus - a.peratus) || (b.k[0] - a.k[0]) || (b.k[1] - a.k[1]) || (b.k[2] - a.k[2]);
function kecMenang(rows) { const w = {}; rows.filter(r => r.peratus > 0).sort(kecBanding).forEach(r => { const c = w[r.tahun]; if (!c) w[r.tahun] = Object.assign({}, r); else if (!kecBanding(c, r) && !c.kelas.includes(r.kelas)) c.kelas += ' / ' + r.kelas; }); return w; }

  const n = $('#atGo', B); if (n) n.onclick = async () => { if ($('#atNaik', B).value.trim().toUpperCase() !== 'NAIK') return toast('Taip NAIK untuk mengesahkan.', true);
    const tamatAkhir = $('#atTamat', B).checked, paksa = !!($('#atPaksa', B) && $('#atPaksa', B).checked);
    if (!(await confirmBox(`Naikkan <b>${r.naik}</b> murid satu ${esc(istilah)}${tamatAkhir && r.tamat ? ` dan tamatkan <b>${r.tamat}</b> murid ${esc(TA)}` : ''}?`, 'Naikkan'))) return;
    n.disabled = true; try { const x = await act(() => call('muridNaikTahun', { sah: 'NAIK', tamatAkhir, paksa })); toast(`${x.dinaikkan} murid dinaikkan${x.ditamatkan ? ', ' + x.ditamatkan + ' murid ' + TA + ' tamat sekolah' : ''}${x.agihanDimasukkan ? '; unit Agihan Koko dimasukkan bagi ' + x.agihanDimasukkan + ' murid Tahun 4' : ''}. Seterusnya: langkah 3, muat naik murid baharu.`); ST.murid = null; ST.kokoUnitCache = null; await refreshBoot(); reload(); } catch (e) { n.disabled = false; } };

PAGES.sistem = async m => {
  const sup = ST.user.peranan === 'SUPERADMIN', sesi = ST.boot.settings.sesi;

    <div class="card c12"><div class="ch"><div><h3>Struktur pangkalan data</h3><div class="sub">Lajur dikenal pasti mengikut nama tajuk. Sheet dan lajur yang tiada boleh dicipta di hujung sheet tanpa menyentuh data sedia ada.</div></div><div class="sp"></div><button class="btn" id="dChk">${ico('refresh')}Semak struktur</button><button class="btn pri" id="dSet">${ico('gear')}Cipta sheet & lajur yang tiada</button></div><div id="dOut"></div></div>

    <div class="card c12" id="csvKad"><h3><span class="langkah-no">3</span>Muat naik pukal data murid (murid baharu &amp; kemas kini IDME)</h3><div class="sub" style="margin-bottom:10px">Gunakan <b>Template Pukal Data Murid</b> (atau fail eksport IDME). Buka template dalam Google Sheets / Excel, pilih semua sel termasuk baris tajuk, salin dan tampal di sini; atau simpan sebagai .csv dan pilih fail. Rekod digabung mengikut No. Pengenalan: murid baharu ditambah, murid sedia ada dikemas kini, dan <b>sel kosong tidak memadam data sedia ada</b>.</div>
      <textarea class="in" id="csv" style="min-height:160px;font-family:var(--f-mono);font-size:11.5px" placeholder="Tampal data di sini (baris pertama ialah tajuk lajur template)"></textarea><div class="tools" style="margin-top:10px"><button class="btn" id="csvF">${ico('upload')}Pilih fail .csv / .tsv</button><label class="sub" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="csvP"> Tukar murid aktif yang <b>tiada</b> dalam fail kepada Pindah (pilih hanya untuk senarai penuh sekolah)</label><div style="flex:1"></div><button class="btn pri" id="csvC">Semak perbezaan</button></div><div id="csvOut"></div></div>
</div>`;
  const showD = d => { $('#dOut').innerHTML = `<div class="tw" style="margin-top:8px"><table><thead><tr><th>Fail</th><th>Sheet</th><th class="r">Baris</th><th>Lajur dikenal pasti</th><th>Lajur tiada</th><th>Lajur lain (dikekalkan)</th></tr></thead><tbody>${d.map(x => `<tr><td class="nw mono">${esc(x.db)}</td><td class="nw"><b>${esc(x.sheet)}</b>${x.ada ? '' : ' ' + chip('Belum wujud', 'bad')}</td><td class="r num">${x.baris}</td><td style="font-size:11.5px">${x.dikenal.map(esc).join('<br>')}</td><td>${x.tiada.map(t => chip(t, 'warn')).join(' ')}</td><td style="font-size:11.5px;color:var(--muted)">${x.lain.map(esc).join(', ')}</td></tr>`).join('')}</tbody></table></div>`; };
  $('#dChk').onclick = async () => { $('#dOut').innerHTML = loadingHTML; showD(await act(() => call('semakStruktur'))); };
  $('#dSet').onclick = async () => { if (await confirmBox('Cipta sheet dan lajur yang tiada? Lajur baharu ditambah di hujung; data sedia ada tidak diubah.')) { await act(() => call('sediaStruktur'), 'Struktur pangkalan data dikemas kini.'); showD(await call('semakStruktur')); } };
  $('#csvF').onclick = async () => { const f = await pickFile('.csv,.tsv,.txt,text/csv,text/tab-separated-values'); if (f) $('#csv').value = await f.text(); };
  const parse = () => {
    const teks = $('#csv').value.replace(/^﻿/, '').trim(); if (!teks) throw new Error('Tampal data template atau pilih fail .csv terlebih dahulu.');
    const sep = teks.split(/\r?\n/)[0].includes('\t') ? '\t' : teks.split(/\r?\n/)[0].includes(';') && !teks.split(/\r?\n/)[0].includes(',') ? ';' : ',';
    // Penghurai CSV/TSV: menyokong petikan "..." (alamat yang mengandungi koma atau baris baharu)
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < teks.length; i++) { const c = teks[i];
      if (q) { if (c === '"') { if (teks[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; continue; }
      if (c === '"' && cell === '') q = true; else if (c === sep) { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c; }
    row.push(cell); rows.push(row);
    const hdr = rows.shift().map(h => MURID_TAJUK[normT(h)] || ''), data = rows.filter(r => r.some(c => String(c).trim()));
    if (!hdr.includes('ic')) throw new Error('Baris pertama mesti baris tajuk template (lajur NO. PENGENALAN tidak dijumpai).');
    if (!data.length) throw new Error('Tiada baris data murid selepas baris tajuk.');
    return data.map(r => { const o = {}; hdr.forEach((f, i) => { if (f && r[i] !== undefined) o[f] = String(r[i]).trim().replace(/^'/, ''); }); return o; }).filter(o => o.ic);
  };
  $('#csvC').onclick = async () => { let rows; try { rows = parse(); } catch (e) { return toast(e.message, true); }
    const p = { rows, tandaPindah: $('#csvP').checked }, st = await act(() => call('muridImport', Object.assign({ semak: true }, p)));
    $('#csvOut').innerHTML = `<div class="sub" style="margin-top:12px">${rows.length} baris dibaca · lajur dikenal pasti: ${[...new Set(Object.keys(rows[0] || {}))].length}</div><div class="grid" style="margin-top:8px">${[['Murid baru', st.baru], ['Dikemas kini', st.kemas], ['Tukar ke Pindah', st.pindah], ['Tiada perubahan', st.sama]].map(([l, v]) => `<div class="card kpi c3" style="box-shadow:none"><span class="k">${l}</span><span class="v num" ${l === 'Tukar ke Pindah' && v ? 'style="color:var(--bad)"' : ''}>${v}</span></div>`).join('')}</div>
      ${st.ralat && st.ralat.length ? `<div class="note" style="margin-top:10px;border-color:var(--bad)"><b>${st.ralat.length} baris tidak diproses:</b><br>${st.ralat.map(esc).join('<br>')}</div>` : ''}<div class="tools" style="justify-content:flex-end;margin-top:10px"><button class="btn pri" id="csvGo">Sahkan & gabung</button></div>`;
    $('#csvGo').onclick = async () => { if (st.pindah && !(await confirmBox(`${st.pindah} murid aktif akan ditukar kepada Pindah kerana tiada dalam fail. Teruskan?`, 'Teruskan'))) return; const r = await act(() => call('muridImport', p)); toast(`Selesai: ${r.baru} baru, ${r.kemas} dikemas kini, ${r.pindah} ditukar ke Pindah.`); ST.murid = null; $('#csvOut').innerHTML = ''; $('#csv').value = ''; await refreshBoot(); }; };
  akhirTahunUI($('#atB'), sup);
};

<script>

/* ---------- Carta organisasi jawatankuasa: Kurikulum, HEM, Kokurikulum ---------- */
const CARTA_INFO = {
  kurikulum: { tajuk: 'Carta Organisasi Kurikulum', sub: 'Jawatankuasa Kurikulum Sekolah', saranan: ['Pengerusi', 'Naib Pengerusi', 'Setiausaha Kurikulum', 'Setiausaha Peperiksaan', 'Penyelaras Pentaksiran', 'Penyelaras Pusat Sumber', 'Penyelaras Prasekolah', 'Penyelaras PPKI', 'Penyelaras Pemulihan', 'Penyelaras NILAM', 'Ketua Panitia Bahasa Melayu', 'Ketua Panitia Bahasa Inggeris', 'Ketua Panitia Matematik', 'Ketua Panitia Sains', 'Ketua Panitia Pendidikan Islam', 'Ahli Jawatankuasa'] },
  hem: { tajuk: 'Carta Organisasi HEM', sub: 'Jawatankuasa Hal Ehwal Murid', saranan: ['Pengerusi', 'Naib Pengerusi', 'Setiausaha HEM', 'Guru Disiplin', 'Guru Bimbingan & Kaunseling', 'Penyelaras RMT & Bantuan', 'Penyelaras Kesihatan', 'Penyelaras Kebersihan & Keceriaan', 'Penyelaras Kantin', 'Penyelaras Keselamatan', 'Penyelaras SPBT', 'Penyelaras Pengawas', 'Ahli Jawatankuasa'] },
  koko: { tajuk: 'Carta Organisasi Kokurikulum', sub: 'Jawatankuasa Kokurikulum Sekolah', saranan: ['Pengerusi', 'Naib Pengerusi', 'Setiausaha Kokurikulum', 'Penyelaras Unit Beruniform', 'Penyelaras Kelab & Persatuan', 'Penyelaras Sukan & Permainan', 'Penyelaras Rumah Sukan', 'Penyelaras PAJSK', 'Ketua Rumah Sukan', 'Ahli Jawatankuasa'] }
};
const CARTA_ARAS = [['1', 'Aras 1 · Pengerusi'], ['2', 'Aras 2 · Naib Pengerusi'], ['3', 'Aras 3 · Setiausaha'], ['4', 'Aras 4 · Penyelaras'], ['5', 'Aras 5 · Ketua Panitia / Unit'], ['6', 'Aras 6 · Ahli Jawatankuasa'], ['7', 'Aras 7'], ['8', 'Aras 8']];
function cartaJK(bahagian) {
  return async m => {
    const info = CARTA_INFO[bahagian], ek = 'cartaEdit_' + bahagian, edit = ST[ek] && lv() >= 1;
    const [rows] = await Promise.all([call('carta', { bahagian }), guruList()]);
    const aras = [...new Set(rows.map(r => r.aras))].sort((a, b) => a - b), byAras = a => rows.filter(r => r.aras === a).sort((x, y) => x.susunan - y.susunan);
    const node = (r, k, n, ai) => `<div class="tn"><div class="node ${ai === 0 ? 'lead' : ''}">${ph(r.foto, r.nama || '?', 'pp')}<span class="jw">${esc(r.jawatan)}</span><b>${r.nama ? esc(r.nama) : '<span style="color:var(--muted)">Belum dilantik</span>'}</b>${edit ? `<div class="acts">
        <button class="btn sm" data-mv="${r.id}" data-d="L" title="Ke kiri" ${k === 0 ? 'disabled' : ''}>${ico('left')}</button><button class="btn sm" data-mv="${r.id}" data-d="U" title="Naik satu aras" ${r.aras <= 1 ? 'disabled' : ''}>▲</button><button class="btn sm" data-mv="${r.id}" data-d="D" title="Turun satu aras" ${r.aras >= 8 ? 'disabled' : ''}>▼</button><button class="btn sm" data-mv="${r.id}" data-d="R" title="Ke kanan" ${k === n - 1 ? 'disabled' : ''}>${ico('right')}</button></div>
        <div class="acts"><button class="btn sm" data-cf="${r.id}" title="Muat naik gambar (disimpan ke Warga Sekolah)">${ico('camera')}</button><button class="btn sm" data-ce="${r.id}" title="Edit">${ico('edit')}</button><button class="btn sm" data-cd="${r.id}" title="Padam" style="color:var(--bad)">${ico('trash')}</button></div>` : ''}</div></div>`;
    const chart = () => rows.length ? `<div class="otree">${aras.map((a, ai) => { const xs = byAras(a); return `<div class="tl">${xs.map((r, k) => node(r, k, xs.length, ai)).join('')}</div>`; }).join('')}</div>` : `<div class="empty">Carta belum diisi.${lv() >= 1 ? ' Tekan <b>Jana carta asas</b> untuk mula dengan jawatan lazim, atau <b>Tambah jawatan</b>.' : ''}</div>`;
    const tanpaGambar = rows.filter(r => r.nama && !r.foto).length;
    m.innerHTML = head(info.tajuk, info.sub + ' sesi ' + esc(ST.boot.settings.sesi) + ' · gambar diselaraskan daripada Warga Sekolah', `<div class="tools">${lv() >= 1 ? `<button class="btn ${edit ? 'pri' : ''}" id="cjEd">${ico('edit')}${edit ? 'Selesai menyunting' : 'Mod sunting'}</button>${edit ? `<button class="btn pri" id="cjAdd">${ico('plus')}Tambah jawatan</button>` : ''}${!rows.length ? `<button class="btn" id="cjTpl">${ico('layers')}Jana carta asas</button>` : ''}` : ''}<button class="btn" id="cjV">${ico('eye')}Lihat / Cetak</button></div>`)
      + (edit ? `<div class="note" style="margin-bottom:12px">Mod sunting: ◀ ▶ ubah kedudukan dalam aras, ▲ ▼ ubah hierarki, ✎ edit jawatan / nama, 🗑 padam. Nama dipilih daripada senarai guru; gambar diambil automatik daripada Warga Sekolah, dan gambar yang dimuat naik di sini turut dikemas kini di Warga Sekolah.${tanpaGambar ? ` <b>${tanpaGambar} nama</b> belum ada gambar di Warga Sekolah.` : ''}</div>` : '')
      + `<div class="card" style="overflow-x:auto">${chart()}</div>`;
    hydrate(m);
    const ed = $('#cjEd'); if (ed) ed.onclick = () => { ST[ek] = !ST[ek]; reload(); };
    $('#cjV').onclick = () => showPrint(paperHead(info.tajuk.toUpperCase(), 'SESI ' + ST.boot.settings.sesi) + `<div class="title">${esc(info.sub.toUpperCase())}<br>${esc(ST.boot.settings.namaSekolah.toUpperCase())}<br>SESI ${esc(ST.boot.settings.sesi)}</div>` + chart().replace(/<div class="acts">[\s\S]*?<\/div>/g, ''));
    const tp = $('#cjTpl'); if (tp) tp.onclick = async () => { const n = await act(() => call('cartaTemplat', { bahagian })); toast(`${n} jawatan lazim ditambah. Pilih nama guru bagi setiap jawatan dalam Mod sunting.`); ST[ek] = true; reload(); };
    const fields = [{ f: 'jawatan', l: 'Jawatan (boleh tulis sendiri)', req: 1, full: 1, ph: 'Contoh: Setiausaha Kurikulum' }, { f: 'nama', l: 'Nama guru', t: 'guru', ph: '– Belum dilantik –' }, { f: 'aras', l: 'Aras dalam hierarki', t: 'select', opts: CARTA_ARAS }, { f: 'susunan', l: 'Kedudukan dalam aras (1 = paling kiri)', t: 'number' }];
    const dl = `<datalist id="cjSaranan">${info.saranan.map(x => `<option value="${esc(x)}">`).join('')}</datalist>`;
    const form = r => formModal(r.id ? 'Edit jawatan' : 'Tambah jawatan', fields, Object.assign({}, r, { aras: String(r.aras || 6) }), async o => { o.id = r.id; await act(() => call('cartaSave', { bahagian, row: o }), 'Carta organisasi dikemas kini.'); reload(); },
      { pre: dl, bind: d => d.querySelector('#f_jawatan').setAttribute('list', 'cjSaranan'), del: r.id ? async () => { await act(() => call('cartaDel', { bahagian, id: r.id }), 'Jawatan dipadam.'); closeModal(); reload(); } : null });
    const a = $('#cjAdd'); if (a) a.onclick = () => form({ aras: 6, susunan: byAras(6).length + 1 });
    $$('[data-ce]', m).forEach(b => b.onclick = () => form(rows.find(x => x.id === b.dataset.ce)));
    $$('[data-cd]', m).forEach(b => b.onclick = async () => { const r = rows.find(x => x.id === b.dataset.cd); if (await confirmBox(`Padam jawatan "${r.jawatan}"${r.nama ? ' (' + r.nama + ')' : ''} daripada carta?`, 'Padam')) { await act(() => call('cartaDel', { bahagian, id: r.id }), 'Jawatan dipadam.'); reload(); } });
    // Gambar dimuat naik di carta disimpan terus ke Warga Sekolah, jadi semua carta & Warga memaparkan gambar yang sama
    $$('[data-cf]', m).forEach(b => b.onclick = async () => { const r = rows.find(x => x.id === b.dataset.cf);
      if (!r.nama) return toast('Pilih nama guru dahulu sebelum memuat naik gambar.', true);
      const f = await pickFile(); if (!f) return;
      try { const id = await uploadImage('guru', f); const st = await act(() => call('fotoWarga', { nama: r.nama, foto: id })); toast(st === 'baru' ? `Gambar disimpan dan ${r.nama} ditambah ke Warga Sekolah.` : `Gambar ${r.nama} dikemas kini di Warga Sekolah dan semua carta.`); reload(); } catch (e) { } });
    $$('[data-mv]', m).forEach(b => b.onclick = async () => {
      const r = rows.find(x => x.id === b.dataset.mv), d = b.dataset.d, a0 = r.aras, ubah = {};
      const nombor = a => byAras(a).forEach((x, i) => { x.susunan = i + 1; ubah[x.id] = x; });
      if (d === 'L' || d === 'R') { const xs = byAras(a0), i = xs.indexOf(r), j = d === 'L' ? i - 1 : i + 1; if (j < 0 || j >= xs.length) return; [xs[i], xs[j]] = [xs[j], xs[i]]; xs.forEach((x, k) => { x.susunan = k + 1; ubah[x.id] = x; }); }
      else { const a1 = d === 'U' ? a0 - 1 : a0 + 1; if (a1 < 1 || a1 > 8) return; r.aras = a1; r.susunan = 999; nombor(a0); nombor(a1); }
      await act(() => call('cartaSusun', { bahagian, rows: Object.values(ubah).map(x => ({ id: x.id, aras: x.aras, susunan: x.susunan })) }), 'Kedudukan carta dikemas kini.'); reload();
    });
  };
}

/* ---------- Pautan ---------- */
function pautanSenarai(rows) {

PAGES.pautan = async m => {

    $('#khS').onclick = async () => { let r; try { r = await act(() => call('kokoHadirSave', { kat: s.kat, unit: s.unit, tarikh: s.tarikh, perjumpaan: $('#khP').value, aktiviti: $('#khA').value, tidakHadir: Object.keys(st).filter(k => !st[k]) })); } catch (e) { return; } toast(`Kehadiran ${s.unit} perjumpaan ke-${$('#khP').value} disimpan: ${r.bilHadir}/${r.bilAhli} hadir. Data ini dipautkan ke Laporan Kokurikulum.`); reload(); };
    const kl = $('#khL'); if (kl) kl.onclick = () => genEdit('laporanKoko', { kategori: cat.label, unit: s.unit, perjumpaan: String(d.perjumpaan), tarikh: s.tarikh, tajuk: d.aktiviti || '' });
  };
  draw();
};

      <div class="tw"><table class="bk"><thead><tr><th>Masa</th>${d.hari.map((t, i) => `<th>${['ISNIN', 'SELASA', 'RABU', 'KHAMIS', 'JUMAAT'][i]}<br><small style="font-weight:400">${fmtD(t)}</small></th>`).join('')}</tr></thead><tbody>${d.masa.map(x => `<tr><td class="num">${x}<br><small style="color:var(--muted)">${tamat(x)}</small></td>${d.hari.map(t => `<td>${cell(t, x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>

/* ---------- Pemulihan & PIT1 ---------- */
// o: { l1, l2 } label pelepasan; pbd: tunjuk TP PBD fasa 1 & 2 (PLaN)
function intervensiPage(key, t, tajuk, statusOpts, o = {}) {
  const L1 = o.l1 || 'Pelepasan 1', L2 = o.l2 || 'Pelepasan 2', TP = ['', 'TP1', 'TP2', 'TP3', 'TP4', 'TP5', 'TP6'], KAT = o.kategori ? PEM_KAT : null;
  return async m => {
    const rows = await call('list', { t }), f = ST['iv' + t] = ST['iv' + t] || { kelas: '', papar: 'semua', kat: '' }, pautan = t === 'PEMULIHAN' ? (await call('list', { t: 'PAUTAN' })).filter(r => r.kategori === 'Pemulihan PPD') : [];
    const on = v => /^(YA|Y|1|TRUE)$/i.test(String(v).trim());
    const dua = r => !!KAT && String(r.kategori || '').replace(/\s/g, '').toUpperCase().includes('BM' + String.fromCharCode(47) + 'MT');
    // Subjek yang dilepaskan pada satu pelepasan (BM/MT); "YA" lama dikira kedua-dua subjek
    const sj = (r, fl) => { const v = String(r[fl] || '').toUpperCase(); return on(v) ? { BM: 1, MT: 1 } : { BM: /\bBM\b/.test(v), MT: /\bMT\b/.test(v) }; };
    const adaL = (r, fl) => dua(r) ? (sj(r, fl).BM || sj(r, fl).MT) : on(r[fl]);
    const lepasSub = (r, s) => sj(r, 'lepas1')[s] || sj(r, 'lepas2')[s];
    const lepas = r => dua(r) ? lepasSub(r, 'BM') && lepasSub(r, 'MT') : on(r.lepas1) || on(r.lepas2);
    // Fasa murid keluar program: 1 subjek = pelepasan yang ditanda; BM/MT = pelepasan subjek terakhir dilepaskan (kedua-dua subjek mesti ditanda)
    const fasaSub = (r, s) => sj(r, 'lepas1')[s] ? 1 : sj(r, 'lepas2')[s] ? 2 : 0;
    const fasa = r => dua(r) ? (fasaSub(r, 'BM') && fasaSub(r, 'MT') ? Math.max(fasaSub(r, 'BM'), fasaSub(r, 'MT')) : 0) : on(r.lepas1) ? 1 : on(r.lepas2) ? 2 : 0;
    const satu = !!o.satu;
    const nF = (R, k) => R.filter(r => fasa(r) === k).length;
    const n1 = satu ? nF(rows, 1) : rows.filter(r => adaL(r, 'lepas1')).length, n2 = satu ? nF(rows, 2) : rows.filter(r => adaL(r, 'lepas2')).length, baki = rows.filter(r => !lepas(r)).length;
    const xs = rows.filter(r => (!f.kelas || r.kelas === f.kelas) && (!KAT || !f.kat || (f.kat === '-' ? !r.kategori : r.kategori === f.kat)) && (f.papar === 'semua' || (f.papar === 'baki' ? !lepas(r) : lepas(r)))).sort((a, b) => String(a.kelas).localeCompare(b.kelas) || String(a.nama).localeCompare(b.nama));
    const kelas = [...new Set(rows.map(r => r.kelas).filter(Boolean))].sort(), tanpaKat = KAT ? rows.filter(r => !r.kategori).length : 0;
    const statusChip = r => { if (lepas(r)) return chip('Dilepaskan', 'good'); if (dua(r) && (lepasSub(r, 'BM') || lepasSub(r, 'MT'))) return chip((lepasSub(r, 'BM') ? 'BM' : 'MT') + ' dilepaskan', 'acc'); return chip(r.status || 'Dalam program', 'warn'); };
    // Murid satu subjek: tanda Pelepasan 1 ATAU Pelepasan 2 sahaja (satu tanda = menguasai dan keluar program)
    const kotak = (r, fl, lab) => { const lain = fl === 'lepas1' ? 'lepas2' : 'lepas1', kunci = satu && on(r[lain]) && !on(r[fl]);
      return `<input type="checkbox" data-l="${fl}" data-id="${r.id}" ${on(r[fl]) ? 'checked' : ''} ${kunci ? 'disabled' : ''} title="${kunci ? 'Murid telah keluar program pada ' + (fl === 'lepas1' ? L2 : L1) : lab}" aria-label="${lab} ${esc(r.nama)}" style="width:18px;height:18px">`; };
    // BM/MT: dua kotak dalam setiap pelepasan; subjek yang sudah dilepaskan dalam pelepasan lain dikunci
    const kotakDua = (r, fl, lab) => { const lain = fl === 'lepas1' ? 'lepas2' : 'lepas1', a = sj(r, fl), b = sj(r, lain);
      return `<div class="lp2">${['BM', 'MT'].map(s => `<label title="${lab} ${s}${b[s] ? ' (telah dilepaskan dalam ' + (fl === 'lepas1' ? L2 : L1) + ')' : ''}"><input type="checkbox" data-l="${fl}" data-s="${s}" data-id="${r.id}" ${a[s] ? 'checked' : ''} ${b[s] && !a[s] ? 'disabled' : ''} aria-label="${lab} ${s} ${esc(r.nama)}">${s}</label>`).join('')}</div>`; };
    const katSel = r => `<select class="in" data-kat="${r.id}" style="min-width:150px;padding:5px 8px" aria-label="Kategori ${esc(r.nama)}">${r.kategori ? '' : '<option value="">– Tag kategori –</option>'}${KAT.map(k => `<option ${k === r.kategori ? 'selected' : ''}>${k}</option>`).join('')}</select>`;
    const ringKat = KAT ? `<div class="card c12"><div class="ch"><div><h3>Ringkasan mengikut kategori</h3><div class="sub">Data awal − ${L1} − ${L2} = Baki. Pemulihan BM/MT dikira keluar program hanya apabila kedua-dua subjek ditanda; lajur BM / MT dilepaskan menunjukkan kemajuan setiap subjek.</div></div></div><div class="tw"><table><thead><tr><th>Kategori</th><th class="r">Data awal</th><th class="r">${L1}</th><th class="r">${L2}</th><th class="r">BM dilepaskan</th><th class="r">MT dilepaskan</th><th class="r">Baki</th></tr></thead><tbody>${[...KAT, ''].map(k => { const R = rows.filter(r => (r.kategori || '') === k); if (!k && !R.length) return '';
        const d2 = k === KAT[2], sub = s => d2 ? R.filter(r => lepasSub(r, s)).length : (k.endsWith(s) ? R.filter(lepas).length : '–');
        return `<tr><td><b>${k || 'Belum ditag'}</b></td><td class="r num">${R.length}</td><td class="r num">${satu ? nF(R, 1) : R.filter(r => adaL(r, 'lepas1')).length}</td><td class="r num">${satu ? nF(R, 2) : R.filter(r => adaL(r, 'lepas2')).length}</td><td class="r num">${sub('BM')}</td><td class="r num">${sub('MT')}</td><td class="r num">${R.filter(r => !lepas(r)).length}</td></tr>`; }).join('')}</tbody></table></div></div>` : '';
    m.innerHTML = head(tajuk, `Data awal, pelepasan dan baki murid dalam program · sesi ${esc(ST.boot.settings.sesi)}`, `<div class="tools"><button class="btn" id="ivOpr">${ico('print')}Cetak OPR</button><button class="btn pri" id="ivAdd">${ico('plus')}Tambah murid (data awal)</button></div>`)
      + `<div class="grid" style="margin-bottom:16px"><div class="card kpi c3"><span class="k">Data awal</span><span class="v num">${rows.length}</span><span class="d">Jumlah murid didaftarkan</span></div><div class="card kpi c3"><span class="k">${L1}</span><span class="v num" style="color:var(--good)">${n1}</span>${satu ? '<span class="d">Murid keluar program pada ' + L1 + '</span>' : KAT ? '<span class="d">Murid dengan sekurang-kurangnya satu subjek</span>' : ''}</div><div class="card kpi c3"><span class="k">${L2}</span><span class="v num" style="color:var(--good)">${n2}</span>${satu ? '<span class="d">Murid keluar program pada ' + L2 + '</span>' : ''}</div><div class="card kpi c3"><span class="k">Baki dalam program</span><span class="v num" style="color:var(--warn)">${baki}</span><span class="d">${satu ? `${rows.length} − ${n1} − ${n2} = <b>${baki}</b>` : (rows.length ? Math.round(baki / rows.length * 100) : 0) + '% daripada data awal'}</span></div>
        ${tanpaKat ? `<div class="c12 note warn">${tanpaKat} murid belum ditag kategori pemulihan (BM, MT atau BM/MT). Pilih kategori dalam lajur <b>Kategori</b>, atau tapis "Belum ditag" dan gunakan <b>Tag semua yang dipaparkan</b>.</div>` : ''}

  await muatSkrip(asas + 'pdf.min.js'); window.pdfjsLib.GlobalWorkerOptions.workerSrc = asas + 'pdf.worker.min.js'; return window.pdfjsLib;

    const tc = await (await doc.getPage(n)).getTextContent(), items = tc.items.filter(i => String(i.str).trim()).map(i => ({ s: String(i.str).trim(), x: Math.round(i.transform[4]), y: Math.round(i.transform[5]) }));
    const lines = []; items.forEach(i => { let l = lines.find(l2 => Math.abs(l2.y - i.y) <= 3); if (!l) lines.push(l = { y: i.y, items: [] }); l.items.push(i); });
    lines.forEach(l => { l.items.sort((a, b) => a.x - b.x); l.text = l.items.map(i => i.s).join(' ').replace(/\s+/g, ' '); }); lines.sort((a, b) => b.y - a.y); pages.push({ items, lines });

const isoDari = s => { const m = String(s).match(/(\d\d)\.(\d\d)\.(\d{4})/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };

      const hMinggu = pg.items.find(i => i.s === 'MINGGU'), xM = hMinggu ? hMinggu.x : 450; let penggal = 1, cutiNama = '';

        const r = l.text.match(reRange); if (r) { out.cuti.push({ nama: cutiNama || 'Cuti', mula: isoDari(r[1]), akhir: isoDari(r[2]) }); bertarikh.push({ y: l.y, jenis: 'cuti' }); if (/PERTENGAHAN/i.test(cutiNama)) penggal = 2; return; }
        const t = l.text.match(reTwo); if (t) { out.sekolah.push({ mula: isoDari(t[1]), akhir: isoDari(t[2]), penggal }); bertarikh.push({ y: l.y, jenis: 'sekolah' }); }

      kiri.filter(i => isoDari(i.s)).forEach(i => { const f = fest.slice().sort((a, b) => Math.abs(a.y - i.y) - Math.abs(b.y - i.y))[0]; if (f) f.rasmi.push(isoDari(i.s)); });

}

  if (sk.length) tambah(sk[0].mula, '', `Hari Pertama Persekolahan Sesi ${h.tahun}`);
  h.cuti.forEach(c => { tambah(c.mula, c.akhir, c.nama); const lepas = sk.find(s => s.mula > c.akhir); if (lepas) tambah(lepas.mula, '', /PERTENGAHAN/i.test(c.nama) ? 'Hari Pertama Persekolahan Penggal 2' : 'Persekolahan Dibuka Semula'); });

function huraiJadualTeks(teks) {
  teks = String(teks || '').replace(/^﻿/, '').trim(); if (!teks) return [];
  const b1 = teks.split(/\r?\n/)[0], sep = b1.includes('\t') ? '\t' : (b1.includes(';') && !b1.includes(',')) ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < teks.length; i++) { const c = teks[i];
    if (q) { if (c === '"') { if (teks[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; continue; }
    if (c === '"' && cell === '') q = true; else if (c === sep) { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c; }
  row.push(cell); rows.push(row); return rows.filter(r => r.some(c => String(c).trim()));
}

// Penghurai satu halaman PDF: items [{s, x, y, f, w}] kepada { guru, hari, waktu, sel, mp, jumlah }
function huraiJadualHalaman(items) {
  const T0 = items.map(i => ({ s: String(i.s).trim(), x: i.x, y: i.y, f: i.f, w: i.w })).filter(i => i.s), T = [];
  // Cantumkan serpihan teks pada baris yang sama (cth. "1" + "3" = "13")

  const ng = T.find(i => /^Nama Guru\s{0,}:/i.test(i.s)); if (ng) out.guru = ng.s.replace(/^Nama Guru\s{0,}:\s{0,}/i, '').trim();

  const sk = T.filter(i => i.f >= 20).sort((a, b) => b.f - a.f)[0]; if (sk) out.sekolah = sk.s;
  // Hari: label di kiri jadual
  const HN = ['ISNIN', 'SELASA', 'RABU', 'KHAMIS', 'JUMAAT', 'SABTU', 'AHAD'];
  out.hari = T.filter(i => HN.includes(i.s.toUpperCase()) && i.x < 90).sort((a, b) => b.y - a.y).map(i => ({ n: i.s.toUpperCase(), y: i.y + i.f * 0.35 }));

  const hdr = T.filter(i => i.y > yTop + 15 && i.y < yTop + 60);
  const nums = hdr.filter(i => /^\d{1,2}$/.test(i.s) && i.f >= 9).sort((a, b) => a.x - b.x);
  const masa = hdr.filter(i => /^\d{1,2}[:.]\d{2}$/.test(i.s));
  nums.forEach((n, k) => { const nx = nums[k + 1] ? nums[k + 1].x : n.x + (nums[1] ? nums[1].x - nums[0].x : 60);
    const ms = masa.filter(t => t.x > n.x && t.x < nx).sort((a, b) => b.y - a.y);
    out.waktu.push({ n: +n.s, x0: n.x - 4, x1: nx - 4, mula: ms[0] ? ms[0].s : '', tamat: ms[1] ? ms[1].s : '' }); });

  const hariDi = y => out.hari.findIndex(h => y <= h.y + rowH / 2 && y > h.y - rowH / 2);
  const wDi = x => out.waktu.findIndex(w => x >= w.x0 && x < w.x1);
  const xMin = out.waktu[0].x0, xMax = out.waktu[out.waktu.length - 1].x1, yMin = out.hari[out.hari.length - 1].y - rowH / 2;

      if (b) { a.s += b.s; a.w = Math.max(a.w, b.w); b.buang = true; } });
    besar = besar.filter(i => !i.buang);
    const atas = besar.filter(i => i.y > h.y - 2).sort((a, b) => a.x - b.x), bawah = besar.filter(i => i.y <= h.y - 2).sort((a, b) => a.x - b.x);
    const guna = new Set(), blok = [];
    // Petak berbelah (dua kelas serentak): subjek atas & bawah sejajar, setiap separuh ada kelas pada baris yang sama
    atas.forEach(a => {
      if (guna.has(a)) return;
      const kA = atas.filter(c => c !== a && !guna.has(c) && Math.abs(c.y - a.y) < 4 && c.x > a.x + 3);
      const b = bawah.find(b => !guna.has(b) && Math.abs(b.x - a.x) < 2.5);
      if (!b || !kA.length) return;
      const kB = bawah.filter(c => c !== b && !guna.has(c) && Math.abs(c.y - b.y) < 4 && c.x > b.x + 3);
      blok.push({ x: a.x, ss: [a, b], ka: kA, kb: kB, belah: true }); [a, b, ...kA, ...kB].forEach(i => guna.add(i));
    });
    atas.filter(a => !guna.has(a)).forEach(a => { guna.add(a); blok.push({ x: a.x, ss: [a], belah: false }); });
    blok.sort((p, q) => p.x - q.x);
    blok.forEach((B, k) => {
      const lepas = blok[k + 1] ? blok[k + 1].x : xMax + 1;
      if (B.belah) { B.ka = B.ka.filter(c => c.x < lepas); B.kb = B.kb.filter(c => c.x < lepas); B.kl = [B.ka[0], B.kb[0]].filter(Boolean); }
      else { B.kl = bawah.filter(c => !guna.has(c) && c.x + c.w > B.x && c.x < lepas - 2); B.kl.forEach(c => guna.add(c)); }
      const kanan = Math.max(...B.ss.map(s => s.x + s.w), ...B.kl.map(c => c.x + c.w));
      const w0 = wDi(B.x + 1), w1 = Math.max(w0, wDi(kanan - 3));

      out.sel.push({ h: hi, w0, w1, sub: [...new Set(B.ss.map(s => s.s))].join(' / '), kelas: B.kl.map(c => c.s).join(', '), bilik, belah: B.belah });
    });
    bawah.filter(c => !guna.has(c)).forEach(c => { const w0 = wDi(c.x + 1); out.sel.push({ h: hi, w0, w1: Math.max(w0, wDi(c.x + c.w - 3)), sub: '', kelas: c.s, bilik: '' }); });
  });
  // Ringkasan mata pelajaran (jadual bawah)
  const mpH = T.find(i => /^MATA PELAJARAN$/i.test(i.s)), jH = T.find(i => /^JUMLAH$/i.test(i.s));
  if (mpH && jH) {
    const bawahMp = T.filter(i => i.y < mpH.y - 2 && i.y > mpH.y - 400 && i.x < jH.x + 60 && i.x >= mpH.x - 5);
    const nama = bawahMp.filter(i => Math.abs(i.x - mpH.x) < 5 && !/^\d+$/.test(i.s)), nilai = bawahMp.filter(i => Math.abs(i.x - jH.x) < 8 && /^\d+$/.test(i.s));
    nama.forEach(n => { const v = nilai.find(x => Math.abs(x.y - n.y) < 3); out.mp.push({ nama: n.s, jumlah: v ? +v.s : 0 }); });
    const sisa = nilai.filter(v => !nama.some(n => Math.abs(n.y - v.y) < 3)).sort((a, b) => a.y - b.y)[0]; if (sisa) out.jumlah = +sisa.s;
  }

  return out;
}

// Jadual kelas: digabung daripada jadual semua guru yang mengajar kelas itu
function jwKelasSenarai(L) { const s = new Set(); L.forEach(g => ((g.data || {}).sel || []).forEach(c => String(c.kelas || '').split(',').map(x => x.trim()).filter(Boolean).forEach(k => s.add(k)))); return [...s].sort((a, b) => a.localeCompare(b, 'ms', { numeric: true })); }
function jwKelasOPR(kelas, L, S0) {
  const rujuk = L.find(g => g.data && g.data.waktu && g.data.waktu.length), d = rujuk ? rujuk.data : { waktu: [], hari: [] }, W = d.waktu, H = d.hari;
  const sel = []; L.forEach(g => ((g.data || {}).sel || []).forEach(c => { if (String(c.kelas || '').split(',').map(x => x.trim()).includes(kelas)) sel.push(Object.assign({ guru: g.padan || g.guru }, c)); }));
  const baris = H.map((h, hi) => { let td = '', w = 0;
    while (w < W.length) { const xs = sel.filter(c => c.h === hi && c.w0 === w);
      if (xs.length) { const span = Math.min(W.length, Math.max(...xs.map(c => c.w1)) + 1) - w; td += `<td colspan="${span}" style="background:${jwWarna(xs[0].sub)}">${xs.map(c => `<b>${esc(c.sub)}</b><span class="kl" style="text-align:left;font-size:9.5px;font-weight:600">${esc(c.guru)}${c.bilik ? ' · ' + esc(c.bilik) : ''}</span>`).join('')}</td>`; w += span; }
      else if (sel.some(c => c.h === hi && c.w0 < w && c.w1 >= w)) w++;
      else { td += '<td></td>'; w++; } }
    return `<tr><th>${esc(h)}</th>${td}</tr>`; }).join('');
  return `${paperHead('JADUAL WAKTU KELAS', S0 ? 'SIRI ' + String(S0.siri).toUpperCase() : '')}<div class="jw-nama"><span>Kelas: <b>${esc(kelas)}</b></span><span>Dijana daripada jadual waktu guru${S0 ? ` · siri ${esc(S0.siri)} mulai ${fmtD(S0.mula)}` : ''}</span></div>
    <div class="jw-wrap"><table class="jwt"><thead><tr><th style="width:74px"></th>${W.map(w => `<th>${w.n}<small>${esc(w.mula)}${w.tamat ? ' - ' + esc(w.tamat) : ''}</small></th>`).join('')}</tr></thead><tbody>${baris}</tbody></table></div>
    <p style="font-size:10.5px;color:#47526d;margin-top:8px">${sel.length} slot pengajaran daripada ${new Set(sel.map(c => c.guru)).size} guru.</p>`;
}

PAGES.jadual = async m => {

  const r = await call('jadualSiri', { siriId: f.siriId }), urus = lv() >= 2, S0 = r.siri.find(x => x.id === r.pilih);
  const L = r.guru.slice().sort((a, b) => a.guru.localeCompare(b.guru));
  if (!L.some(g => g.id === f.pilih)) f.pilih = r.saya || (L[0] || {}).id || '';
  if (f.tab === 'urus' && !urus) f.tab = 'guru';
  const tabs = [['guru', 'Jadual Guru'], ['kelas', 'Jadual Kelas']].concat(urus ? [['urus', 'Urus Siri & Muat Naik']] : []);
  m.innerHTML = head('Jadual Guru', S0 ? `Siri ${esc(S0.siri)} · digunakan mulai ${fmtD(S0.mula)}${S0.aktif ? ' · <b>siri semasa</b>' : ''} · ${L.length} guru` : 'Muat naik PDF jadual waktu guru (aSc Timetables) mengikut siri',
    `<div class="tools">${r.siri.length > 1 ? sel('jwS', r.siri.filter(x => x.status === 'Lengkap').map(x => [x.id, `Siri ${x.siri} · mulai ${fmtD(x.mula)}${x.aktif ? ' (semasa)' : ''}`]), r.pilih) : ''}<div class="seg">${tabs.map(t => `<button data-t="${t[0]}" class="${f.tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</div></div>`) + '<div id="jwB"></div>';

  if (f.tab === 'guru') {

      B.innerHTML = `<div class="card"><div class="ch" style="flex-wrap:wrap;gap:8px"><div style="flex:1;min-width:220px">${sel('jwG', L.map(x => [x.id, x.guru + (x.id === r.saya ? '  (saya)' : '')]), g.id, 'style="width:100%"')}</div>
        <div class="seg"><button data-m="opr" class="${f.mod === 'opr' ? 'on' : ''}">Paparan OPR</button><button data-m="img" class="${f.mod === 'img' ? 'on' : ''}">Gambar asal</button></div>
        <button class="btn pri" id="jwP">${ico('print')}Lihat / Cetak</button>${urus ? `<button class="btn" id="jwPA">${ico('print')}Cetak semua guru</button>` : ''}</div>
        <div class="sub" style="margin:-4px 0 10px">${g.padan ? `Dipadankan dengan <b>${esc(g.padan)}</b> dalam pangkalan data guru` : 'Nama ini tidak dipadankan dengan pangkalan data guru (paparan tetap boleh dibuat)'} · halaman ${g.halaman} PDF${beza ? ` · <span style="color:var(--warn)">jumlah waktu dalam PDF ${g.data.jumlah}, petak dalam jadual ${jwKiraWaktu(g.data)}</span>` : ''}</div>
        <div id="jwV" class="paper jw-dlm" style="padding:${f.mod === 'opr' ? '18px' : '0'}">${f.mod === 'opr' ? jwOPR(g, S0) : jwGambar(g)}</div></div>`;
      hydrate(B);
      $('#jwG').onchange = e => { f.pilih = e.target.value; reload(); };
