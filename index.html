    B.innerHTML = !L.length ? kosong : `<div class="card"><div class="ch" style="flex-wrap:wrap;gap:8px"><div style="min-width:200px">${sel('jwK', K.map(k => [k, k]), f.kelas)}</div><div class="sp"></div><button class="btn pri" id="jwKP">${ico('print')}Lihat / Cetak</button><button class="btn" id="jwKA">${ico('print')}Cetak semua kelas</button></div>
      <div class="paper jw-dlm" style="padding:18px">${jwKelasOPR(f.kelas, L, S0)}</div></div>`;
    if (L.length) { $('#jwK').onchange = e => { f.kelas = e.target.value; reload(); }; $('#jwKP').onclick = () => showPrint(jwKelasOPR(f.kelas, L, S0), 'lanskap'); $('#jwKA').onclick = () => showPrint(K.map(k => `<div class="jw-pg">${jwKelasOPR(k, L, S0)}</div>`).join(''), 'lanskap'); }
  } else {
    B.innerHTML = `<div class="card"><div class="ch"><div><h3>Siri jadual waktu</h3><div class="sub">Siri semasa ialah siri lengkap terkini yang tarikh mulanya sudah tiba. Guru melihat siri semasa secara automatik.</div></div><div class="sp"></div><button class="btn pri" id="jwUp">${ico('upload')}Muat naik siri baharu</button></div>
      <div class="tw"><table><thead><tr><th>Siri</th><th>Mula digunakan</th><th class="r">Guru</th><th>Status</th><th>Dimuat naik</th><th>Catatan</th><th></th></tr></thead><tbody>${r.siri.map(x => `<tr><td><b>Siri ${esc(x.siri)}</b>${x.aktif ? ' ' + chip('Semasa', 'good') : ''}</td><td class="nw">${fmtD(x.mula)}</td><td class="r num">${x.bilGuru}</td><td>${x.status === 'Lengkap' ? chip('Lengkap', 'good') : chip(x.status || '-', 'warn')}</td><td style="font-size:12px">${esc(x.dimuatNaik)}<br>${esc(x.oleh)}</td><td style="font-size:12px">${esc(x.catatan)}</td>
        <td class="nw">${x.fail ? `<a class="btn sm" href="${safeUrl(JW_DRIVE + x.fail + '/view')}" target="_blank" rel="noopener" title="Buka PDF asal dalam Google Drive">${ico('file')}PDF</a> ` : ''}<button class="btn sm" data-ed="${x.id}">${ico('edit')}</button> <button class="btn sm" data-del="${x.id}" title="Padam siri" style="color:var(--bad)">${ico('trash')}</button></td></tr>`).join('') || '<tr><td colspan="7" class="empty">Belum ada siri.</td></tr>'}</tbody></table></div></div>`;
    $('#jwUp').onclick = () => jwMuatNaik();

      formModal(`Kemas kini siri ${x.siri}`, [{ f: 'siri', l: 'Nombor siri', req: 1 }, { f: 'mula', l: 'Tarikh mula digunakan', t: 'date', req: 1 }, { f: 'catatan', l: 'Catatan', t: 'textarea' }], x, async o => { await act(() => call('jadualSiriKemas', Object.assign({ id: x.id }, o)), 'Siri dikemas kini.'); reload(); }); });
    $$('[data-del]', B).forEach(b => b.onclick = async () => { const x = r.siri.find(s => s.id === b.dataset.del);
      if (await confirmBox(`Padam <b>siri ${esc(x.siri)}</b> berserta ${x.bilGuru} jadual guru dan gambarnya? Tindakan ini tidak boleh dibatalkan.`, 'Padam siri')) { await act(() => call('jadualSiriPadam', { id: x.id }), 'Siri dipadam.'); if (f.siriId === x.id) f.siriId = ''; reload(); } });
  }
  $$('[data-t]', m).forEach(b => b.onclick = () => { f.tab = b.dataset.t; reload(); });

};

// Muat naik PDF: baca dan semak dahulu, kemudian hantar halaman demi halaman (gambar + data)
function jwMuatNaik() {
  const st = { fail: null, hasil: null, sibuk: false };
  const d = openModal(`<h2>Muat naik jadual waktu guru</h2><p class="sub" style="margin:-6px 0 14px">PDF jadual waktu persendirian (satu halaman setiap guru) daripada aSc Timetables.</p>
    <div class="form"><label>Nombor siri<input class="in" id="ju_siri" placeholder="Contoh: 4"></label><label>Tarikh mula digunakan<input class="in" type="date" id="ju_mula" value="${today()}"></label>
    <label class="full">Catatan<input class="in" id="ju_cat" placeholder="Contoh: Pindaan selepas PBD"></label></div>
    <div class="tools" style="margin:12px 0"><button class="btn" id="ju_pilih">${ico('file')}Pilih fail PDF</button><span class="sub" id="ju_nama">Belum ada fail dipilih</span></div>
    <div id="ju_hasil"></div><div class="foot"><button class="btn" id="ju_batal">Batal</button><button class="btn pri" id="ju_hantar" disabled>${ico('upload')}Muat naik</button></div>`, true);
  const hasil = d.querySelector('#ju_hasil');
  d.querySelector('#ju_batal').onclick = () => { if (!st.sibuk) closeModal(); };
  d.querySelector('#ju_pilih').onclick = async () => {
    const file = await pickFile('application/pdf,.pdf'); if (!file) return;
    st.fail = file; d.querySelector('#ju_nama').textContent = file.name + ' · ' + Math.round(file.size / 1024) + ' KB';
    hasil.innerHTML = `<div class="sub">Membaca PDF…</div><div class="prog"><i id="ju_p"></i></div>`;
    try {
      st.hasil = await bacaJadualPdf(file, (n, t) => { const p = d.querySelector('#ju_p'); if (p) p.style.width = (n / t * 100) + '%'; });
      const P = st.hasil.pages, ok = P.filter(p => p.d && p.d.guru), lain = P.length - ok.length, beza = ok.filter(p => p.d.jumlah != null && jwKiraWaktu(p.d) !== p.d.jumlah);
      const siriT = (file.name.match(/SIRI[\s_-]{0,}([0-9]+[A-Za-z]?)/i) || [])[1]; if (siriT && !d.querySelector('#ju_siri').value) d.querySelector('#ju_siri').value = siriT;
      hasil.innerHTML = `<div class="note ${lain ? 'warn' : ''}"><b>${P.length} halaman</b> · ${ok.length} jadual guru dikesan${lain ? ` · ${lain} halaman bukan jadual guru (akan dilangkau)` : ''}${beza.length ? ` · ${beza.length} halaman jumlah waktu PDF berbeza daripada petak jadual (semak paparan selepas muat naik)` : ''}</div>
        <div class="tw jw-up" style="max-height:38vh;overflow:auto;margin-top:10px"><table><thead><tr><th>Hlm</th><th>Nama guru</th><th class="r">Waktu</th><th>Subjek</th></tr></thead><tbody>${P.map(p => `<tr><td class="num">${p.n}</td><td>${p.d && p.d.guru ? esc(p.d.guru) : '<span style="color:var(--muted)">Tiada jadual</span>'}</td><td class="r num">${p.d ? jwKiraWaktu(p.d) + (p.d.jumlah != null && p.d.jumlah !== jwKiraWaktu(p.d) ? ` <span style="color:var(--warn)">/ ${p.d.jumlah}</span>` : '') : ''}</td><td style="font-size:12px">${p.d ? esc([...new Set(p.d.sel.map(c => c.sub).filter(Boolean))].join(', ')) : ''}</td></tr>`).join('')}</tbody></table></div>`;
      d.querySelector('#ju_hantar').disabled = !ok.length;
    } catch (e) { hasil.innerHTML = `<div class="note warn">PDF tidak dapat dibaca: ${esc(e.message)}</div>`; }
  };
  d.querySelector('#ju_hantar').onclick = async () => {
    const siri = d.querySelector('#ju_siri').value.trim(), mula = d.querySelector('#ju_mula').value, P = st.hasil.pages.filter(p => p.d && p.d.guru);
    if (!siri) return toast('Sila isi nombor siri.', true); if (!mula) return toast('Sila pilih tarikh mula digunakan.', true);
    st.sibuk = true; const btn = d.querySelector('#ju_hantar'); btn.disabled = true; d.querySelector('#ju_batal').disabled = true;
    hasil.innerHTML = `<div class="sub" id="ju_s">Menyediakan…</div><div class="prog"><i id="ju_p2"></i></div><p class="sub" style="margin-top:8px">Jangan tutup tetingkap ini sehingga selesai.</p>`;
    const lapor = (t, n) => { d.querySelector('#ju_s').textContent = t; d.querySelector('#ju_p2').style.width = n + '%'; };
    try {
      lapor('Memuat naik fail PDF asal…', 2);
      const pdf = st.fail.size < 7e6 ? await bacaDataUrl(st.fail) : '';
      const siriId = await call('jadualSiriBaru', { siri, mula, catatan: d.querySelector('#ju_cat').value, tajuk: P[0].d.tajuk, bil: P.length, pdf });
      for (let i = 0; i < P.length; i++) {
        lapor(`Halaman ${i + 1} / ${P.length}: ${P[i].d.guru}`, 4 + (i / P.length) * 94);
        const gambar = await gambarHalamanPdf(P[i].pg);
        let cuba = 0; while (true) { try { await call('jadualHalaman', { siriId, halaman: P[i].n, guru: P[i].d.guru, data: P[i].d, gambar }); break; } catch (e) { if (++cuba >= 3) throw e; await new Promise(r => setTimeout(r, 1500 * cuba)); } }
      }
      const n = await call('jadualSiriSiap', { siriId }); lapor('Selesai', 100);
      st.sibuk = false; closeModal(); toast(`Siri ${siri} dimuat naik: ${n} jadual guru.`); ST.jw.siriId = ''; ST.jw.tab = 'guru'; reload();
    } catch (e) { st.sibuk = false; d.querySelector('#ju_batal').disabled = false; toast('Muat naik terhenti: ' + e.message + '. Padam siri yang tidak lengkap dan cuba semula.', true); }
  };
}

/* ---------- Menu widget: Analisis PBD & Peperiksaan (sistem luar dalam iframe, pautan diurus admin) ---------- */
const MENU_WIDGET = {
  pbd: { tajuk: 'Analisis PBD', sub: 'Analisis Pentaksiran Bilik Darjah daripada sistem PBD sekolah', sistem: 'sistem PBD', contoh: 'PBD Tahun 1–6' },
  peperiksaan: { tajuk: 'Peperiksaan', sub: 'Analisis dan pengurusan peperiksaan daripada Sistem Pengurusan Peperiksaan sekolah', sistem: 'Sistem Pengurusan Peperiksaan', contoh: 'UASA 2026' }
};
const menuWidget = jenis => async m => {
  const C = MENU_WIDGET[jenis], L = await call('widgetMenu', { jenis }), f = ST['wg_' + jenis] = ST['wg_' + jenis] || { i: 0 }, admin = lv() >= 3;
  if (f.i >= L.length) f.i = 0;
  const w = L[f.i];
  m.innerHTML = head(C.tajuk, C.sub, `<div class="tools">${L.length > 1 ? `<div class="seg">${L.map((x, i) => `<button data-w="${i}" class="${i === f.i ? 'on' : ''}">${esc(x.nama)}</button>`).join('')}</div>` : ''}${w ? `<a class="btn" href="${safeUrl(w.url)}" target="_blank" rel="noopener">${ico('link')}Buka tab baharu</a><button class="btn" id="wgR">${ico('refresh')}Muat semula</button>` : ''}${admin ? `<button class="btn" id="wgT">${ico('gear')}Tetapan widget</button>` : ''}</div>`)
    + (w ? `${w.catatan ? `<div class="note" style="margin-bottom:12px">${esc(w.catatan)}</div>` : ''}<div class="card" style="padding:0;overflow:hidden"><${IF} id="wgF" src="${safeUrl(w.url)}" style="width:100%;height:${+w.tinggi || 1200}px;border:0;display:block" title="${esc(w.nama)}" allow="fullscreen"></${IF}></div>
        <p class="sub" style="margin-top:8px">Jika paparan kosong, tekan <b>Buka tab baharu</b>. Paparan dalam laman memerlukan ${C.sistem} membenarkan paparan terbenam.</p>`
      : `<div class="card"><div class="empty" style="padding:30px">${admin ? `Belum ada widget ${esc(C.tajuk)}. Tekan <b>Tetapan widget</b> dan tampal pautan Web App daripada ${C.sistem}.` : `${esc(C.tajuk)} belum disediakan. Sila hubungi admin sistem.`}</div></div>`);
  $$('[data-w]', m).forEach(b => b.onclick = () => { f.i = +b.dataset.w; reload(); });
  const r = $('#wgR'); if (r) r.onclick = () => { const x = $('#wgF'); if (x) x.src = x.src; };
  const tt = $('#wgT'); if (tt) tt.onclick = () => menuWidgetTetapan(jenis, L);
};
function menuWidgetTetapan(jenis, L0) {
  const C = MENU_WIDGET[jenis], L = JSON.parse(JSON.stringify(L0.length ? L0 : [{ nama: C.tajuk, url: '', tinggi: 1200, catatan: '' }]));
  const d = openModal(`<h2>Tetapan widget ${esc(C.tajuk)}</h2><p class="sub" style="margin:-6px 0 12px">Tampal pautan widget atau Web App ${C.sistem} (bermula dengan https). Boleh tambah beberapa widget; setiap satu menjadi tab.</p><div id="wgE"></div>
    <div class="note" style="margin-top:12px">Jika ${C.sistem} dibina dengan Apps Script, pautan ialah URL <b>Web app</b> (Deploy › Manage deployments, berakhir dengan <b>/exec</b>). Untuk dipaparkan dalam laman ini, sistem itu perlu menggunakan <b>setXFrameOptionsMode(ALLOWALL)</b> dalam doGet.</div>
    <div class="foot"><button class="btn" id="wgNo">Batal</button><button class="btn pri" id="wgOk">${ico('ok')}Simpan</button></div>`, true);
  const E = d.querySelector('#wgE');
  const draw = () => { E.innerHTML = L.map((w, i) => `<div class="card" style="margin-bottom:10px;padding:12px"><div class="form"><label>Nama tab<input class="in" data-i="${i}" data-k="nama" value="${esc(w.nama)}" placeholder="cth: ${esc(C.contoh)}"></label><label>Tinggi paparan (px)<input class="in" type="number" min="400" max="4000" data-i="${i}" data-k="tinggi" value="${esc(w.tinggi || 1200)}"></label>
      <label class="full">Pautan widget<input class="in" data-i="${i}" data-k="url" value="${esc(w.url)}" placeholder="https:${'/' + '/'}script.google.com/macros/s/.../exec"></label><label class="full">Catatan (pilihan)<input class="in" data-i="${i}" data-k="catatan" value="${esc(w.catatan || '')}"></label></div>
      <div class="tools" style="margin-top:8px;justify-content:flex-end"><button class="btn sm" data-up="${i}" ${i ? '' : 'disabled'}>↑</button><button class="btn sm danger" data-x="${i}">${ico('trash')}Buang</button></div></div>`).join('') + `<button class="btn sm" id="wgAdd">${ico('plus')}Tambah widget</button>`;
    $$('[data-k]', E).forEach(x => x.oninput = () => { L[+x.dataset.i][x.dataset.k] = x.value; });
    $$('[data-up]', E).forEach(b => b.onclick = () => { const i = +b.dataset.up; [L[i - 1], L[i]] = [L[i], L[i - 1]]; draw(); });
    $$('[data-x]', E).forEach(b => b.onclick = () => { L.splice(+b.dataset.x, 1); draw(); });
    d.querySelector('#wgAdd').onclick = () => { L.push({ nama: '', url: '', tinggi: 1200, catatan: '' }); draw(); };
  };
  draw();
  d.querySelector('#wgNo').onclick = closeModal;
  d.querySelector('#wgOk').onclick = async () => { const b = d.querySelector('#wgOk'); b.disabled = true;
    try { await act(() => call('widgetMenuSimpan', { jenis, senarai: L.filter(w => String(w.nama).trim() || String(w.url).trim()) }), `Tetapan widget ${C.tajuk} disimpan.`); closeModal(); ST['wg_' + jenis] = { i: 0 }; reload(); } catch (e) { b.disabled = false; } };
}

<script>
/* HalamanEkoko.html — ciri e-Koko Pintar dalam Laman Pintar: pengesahan GPK, tandatangan & cop, OPR koko awam, dll.
   Dimuatkan selepas Halaman3; PAGES di sini menggantikan halaman koko asal. */

// Latar putih/kelabu cerah dibuang supaya tandatangan boleh diletak di atas cop
function prosesTtd(file, buangLatar = true, max = 700) {
  return new Promise((res, rej) => {
    if (!file || String(file.type).indexOf('image/') !== 0) return rej(new Error('Sila pilih fail gambar (PNG atau JPG).'));
    const r = new FileReader(); r.onerror = () => rej(new Error('Gambar tidak dapat dibaca.'));
    r.onload = () => { const img = new Image(); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
      if (buangLatar) { const d = g.getImageData(0, 0, c.width, c.height), a = d.data; for (let i = 0; i < a.length; i += 4) { const l = (a[i] + a[i + 1] + a[i + 2]) / 3; if (l > 205) a[i + 3] = 0; else if (l > 150) a[i + 3] = Math.round(a[i + 3] * (205 - l) / 55); } g.putImageData(d, 0, 0); }
      res(c.toDataURL('image/png')); }; img.onerror = () => rej(new Error('Format gambar tidak disokong.')); img.src = r.result; };
    r.readAsDataURL(file);
  });
}

    const st = e => { on = true; const [x, y] = pos(e); g.beginPath(); g.moveTo(x, y); e.preventDefault(); }, mv = e => { if (!on) return; const [x, y] = pos(e); g.lineTo(x, y); g.stroke(); e.preventDefault(); }, en = () => on = false;

/* --- e-Koko HalamanAdmin.html · bacaHalamanPdf --- */
// Teks satu halaman disusun kepada baris (ikut kedudukan y), sama seperti pembaca takwim/jadual
async function bacaHalamanPdf(bytes, onProg) {
  const lib = await pdfJs(), doc = await lib.getDocument({ data: bytes.slice() }).promise, pages = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const tc = await (await doc.getPage(n)).getTextContent(), items = tc.items.filter(i => String(i.str).trim()).map(i => ({ s: String(i.str).trim(), x: Math.round(i.transform[4]), y: Math.round(i.transform[5]) }));
    const lines = []; items.forEach(i => { let l = lines.find(l2 => Math.abs(l2.y - i.y) <= 3); if (!l) lines.push(l = { y: i.y, items: [] }); l.items.push(i); });
    lines.forEach(l => { l.items.sort((a, b) => a.x - b.x); l.text = l.items.map(i => i.s).join(' ').replace(/\s+/g, ' ').trim(); }); lines.sort((a, b) => b.y - a.y);
    pages.push(lines.map(l => l.text)); if (onProg) onProg(n, doc.numPages);
  }
  return pages;
}

/* --- e-Koko HalamanAdmin.html · huraiSlip --- */
// Ekstrak maklumat murid daripada satu halaman slip PAJSK (format Laporan Individu PAJSK, IDME / moeis)
function huraiSlip(lines) {
  const t = lines.join('\n'), cari = re => { const m = t.match(re); return m ? m[1].trim() : ''; };
  let ic = cari(/NO\.?\s*MY\s*KA?D\s*:?\s*([\d\s-]{12,16})/i).replace(/\D/g, '');
  if (ic.length !== 12) { const m = t.match(/\b(\d{6}-?\d{2}-?\d{4})\b/); ic = m ? m[1].replace(/\D/g, '') : ''; }
  const gr = t.match(/10%\s*\/\s*GRED\s+([\d.]+)\s*\/\s*([A-G][+-]?)/i);
  return { ic, nama: cari(/^Nama Murid\s*:?\s*(.+)$/im), kelas: cari(/^Kelas\s*:?\s*(.+)$/im), tahun: cari(/^Tahun\s*\/\s*Tingkatan\s*:?\s*(.+)$/im),
    sesi: cari(/SESI\s+AKADEMIK\s+(\d{4}\s*\/\s*\d{4}|\d{4})/i).replace(/\s/g, ''), gpa: cari(/GPA\s*\/\s*CGPA\s+[^:\n]*:\s*([\d.]+\s*\/\s*[\d.]+)/i).replace(/\s/g, ''),
    markah: gr ? gr[1] : '', gred: gr ? gr[2].toUpperCase() : '', sekolah: cari(/^Kod Sekolah\s*:?\s*(\S+)/im) };
}

/* --- e-Koko HalamanAdmin.html · kumpulSlip --- */
// Kumpul halaman mengikut murid: halaman tanpa No. MyKad disambung kepada slip sebelumnya
function kumpulSlip(pages, sumber) {
  const out = [];
  pages.forEach((lines, i) => { const h = huraiSlip(lines);
    if (h.ic) out.push(Object.assign(h, { idx: [i], sumber })); else if (out.length) out[out.length - 1].idx.push(i); else out.push(Object.assign(h, { idx: [i], sumber, ralat: 'No. MyKad tidak dijumpai' })); });
  return out;
}

async function ekBacaPdf(file) {
  const lib = await pdfJs(), doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise, pages = [];
  for (let n = 1; n <= doc.numPages; n++) {
    const tc = await (await doc.getPage(n)).getTextContent(), items = tc.items.filter(i => String(i.str).trim()).map(i => ({ s: String(i.str).trim(), x: Math.round(i.transform[4]), y: Math.round(i.transform[5]), w: Math.round(i.width || 0) }));
    const lines = []; items.forEach(i => { let l = lines.find(l2 => Math.abs(l2.y - i.y) <= 3); if (!l) lines.push(l = { y: i.y, items: [] }); l.items.push(i); });
    // sel: teks dipisahkan oleh ruang mendatar yang luas (lajur jadual)
    lines.forEach(l => { l.items.sort((a, b) => a.x - b.x); l.text = l.items.map(i => i.s).join(' ').replace(/\s+/g, ' '); l.sel = [];
      l.items.forEach((i, k) => { const p = l.items[k - 1]; if (!p || i.x - (p.x + p.w) > 14) l.sel.push(i.s); else l.sel[l.sel.length - 1] += ' ' + i.s; }); });
    lines.sort((a, b) => b.y - a.y); pages.push({ items, lines });
  }
  return pages;
}

/* --- e-Koko HalamanAwam.html · isoT --- */
const isoT = (y, m, d) => { y = +y < 100 ? 2000 + +y : +y; if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return ''; return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; };

/* --- e-Koko HalamanAwam.html · cariTarikh --- */
// Cari tarikh (atau julat tarikh) pertama dalam teks. Pulangkan { mula, akhir, sisa } atau null.
function cariTarikh(teks, thn) {
  const t = String(teks || ''), sk = '\\s*(?:-|–|—|hingga|hinggalah|sehingga|to|sd|s\\/d)\\s*';
  const pola = [
    // 01/03/2026 - 03/03/2026 · 1.3.2026 hingga 3.3.2026
    [new RegExp(`(\\d{1,2})[./-](\\d{1,2})[./-](\\d{2,4})${sk}(\\d{1,2})[./-](\\d{1,2})[./-](\\d{2,4})`, 'i'), m => [isoT(m[3], m[2], m[1]), isoT(m[6], m[5], m[4])]],
    // 1/3 - 3/3/2026
    [new RegExp(`(\\d{1,2})[./-](\\d{1,2})${sk}(\\d{1,2})[./-](\\d{1,2})[./-](\\d{2,4})`, 'i'), m => [isoT(m[5], m[2], m[1]), isoT(m[5], m[4], m[3])]],
    // 1 - 3/3/2026
    [new RegExp(`\\b(\\d{1,2})${sk}(\\d{1,2})[./-](\\d{1,2})[./-](\\d{2,4})`, 'i'), m => [isoT(m[4], m[3], m[1]), isoT(m[4], m[3], m[2])]],
    // 2026-03-01 (ISO)
    [/(\d{4})-(\d{1,2})-(\d{1,2})/, m => [isoT(m[1], m[2], m[3]), '']],
    // 01/03/2026
    [/(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/, m => [isoT(m[3], m[2], m[1]), '']],
    // 12 Mac - 14 April 2026
    [new RegExp(`\\b(\\d{1,2})\\s*(${RE_BULAN})\\.?\\s*(\\d{4})?${sk}(\\d{1,2})\\s*(${RE_BULAN})\\.?\\s*(\\d{4})?`, 'i'), m => { const y = m[6] || m[3] || thn; return [isoT(m[3] || y, BULAN_MS[m[2].toLowerCase()], m[1]), isoT(y, BULAN_MS[m[5].toLowerCase()], m[4])]; }],
    // 12 - 14 Mac 2026 · 12 hingga 14 Mac
    [new RegExp(`\\b(\\d{1,2})${sk}(\\d{1,2})\\s*(${RE_BULAN})\\.?\\s*(\\d{4})?`, 'i'), m => { const y = m[4] || thn, b = BULAN_MS[m[3].toLowerCase()]; return [isoT(y, b, m[1]), isoT(y, b, m[2])]; }],
    // 12 Mac 2026 · 12hb Mac
    [new RegExp(`\\b(\\d{1,2})(?:hb)?\\s*(${RE_BULAN})\\.?,?\\s*(\\d{4})?`, 'i'), m => [isoT(m[3] || thn, BULAN_MS[m[2].toLowerCase()], m[1]), '']],
    // Mac 12, 2026
    [new RegExp(`\\b(${RE_BULAN})\\.?\\s+(\\d{1,2}),?\\s*(\\d{4})?`, 'i'), m => [isoT(m[3] || thn, BULAN_MS[m[1].toLowerCase()], m[2]), '']]];
  for (const [re, f] of pola) { const m = t.match(re); if (!m) continue; const [a, b] = f(m); if (!a) continue;
    return { mula: a, akhir: b && b > a ? b : '', sisa: (t.slice(0, m.index) + ' ' + t.slice(m.index + m[0].length)).trim() }; }
  return null;
}

const bersihAcara = s => String(s || '').replace(/\b(isnin|selasa|rabu|khamis|jumaat|sabtu|ahad|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/gi, ' ')

/* --- e-Koko HalamanAwam.html · katTakwimDari --- */
// Nilai lajur KATEGORI yang ditaip pengguna: nama penuh, nama tersuai (cth. 1M1S), singkatan (UB/KP/SP/RS) atau kata kunci
function katTakwimDari(v) {
  const t = String(v || '').trim().toUpperCase(); if (!t) return '';
  const tepat = KAT_TAKWIM.find(k => k.toUpperCase() === t || (KAT_KOD[k] && (KAT_KOD[k] === t || katNama(k).toUpperCase() === t))); if (tepat) return tepat;
  return /CUTI|TAKWIM KPM/.test(t) ? 'Cuti' : /RUMAH/.test(t) ? 'Rumah Sukan' : /BERUNIFORM|UNIFORM/.test(t) ? 'Unit Beruniform' : /KELAB|PERSATUAN/.test(t) ? 'Kelab & Persatuan'
    : /SUKAN|PERMAINAN|1M1S/.test(t) ? 'Sukan & Permainan' : /KOKURIKULUM|UMUM/.test(t) ? 'Kokurikulum' : '';

/* --- e-Koko HalamanAwam.html · tekaKatTakwim --- */
function tekaKatTakwim(t) { t = String(t).toUpperCase();
  return /\bCUTI\b/.test(t) ? 'Cuti' : /PENGAKAP|PANDU|KADET|PUTERI|BERUNIFORM|BULAN SABIT|ST\.? ?JOHN|KAWAD|PBSM|TKRS|KRS|BRIGED|PERKHEMAHAN/.test(t) ? 'Unit Beruniform'

    : /SUKAN|BOLA|BADMINTON|OLAHRAGA|FUTSAL|PING PONG|TENIS|CATUR|MSSD|MSSN|MSSM|MSSJ|KEJOHANAN|1M1S|RENANG|HOKI|TAKRAW|PETANQUE/.test(t) ? 'Sukan & Permainan' : 'Kokurikulum'; }

// Baris jadual (CSV / Excel / jadual Word): kenal pasti lajur ikut tajuk, jika tiada tajuk gunakan teks penuh setiap baris
function huraiBarisTakwim(rows, thn) {
  rows = rows.map(r => r.map(c => c instanceof Date ? isoT(c.getFullYear(), c.getMonth() + 1, c.getDate()) : typeof c === 'number' && c > 30000 && c < 70000 ? new Date(Math.round((c - 25569) * 864e5)).toISOString().slice(0, 10) : String(c == null ? '' : c).trim()));
  const hi = rows.findIndex(r => r.some(c => /TARIKH|DATE/i.test(c)) && r.some(c => /AKTIVITI|ACARA|PROGRAM|PERKARA|BUTIRAN|EVENT|ATURCARA/i.test(c)));
  const out = [];
  if (hi >= 0) {
    const h = rows[hi].map(c => c.toUpperCase()), col = re => h.findIndex(c => re.test(c));
    const cT = col(/TARIKH|DATE/), cA = col(/AKTIVITI|ACARA|PROGRAM|PERKARA|BUTIRAN|EVENT|ATURCARA/), cE = col(/TAMAT|HINGGA|AKHIR|END/), cK = col(/UNIT|KATEGORI|BIDANG|JENIS/), cP = col(/TEMPAT|LOKASI|VENUE/);
    rows.slice(hi + 1).forEach(r => { const tx = r[cT] || '', d = cariTarikh(tx, thn), e = cE >= 0 ? cariTarikh(r[cE], thn) : null, acara = bersihAcara(r[cA]); if (!d || !acara) return;
      const kat = (cK >= 0 && katTakwimDari(r[cK])) || tekaKatTakwim((cK >= 0 ? r[cK] + ' ' : '') + acara);
      out.push({ tarikh: d.mula, tarikhTamat: e ? e.mula : d.akhir, acara, unit: kat, tempat: cP >= 0 ? r[cP] : '' }); });
  } else rows.forEach(r => { out.push(...huraiTeksTakwim([r.filter(Boolean).join(' · ')], thn)); });
  return out;
}

/* --- e-Koko HalamanAwam.html · huraiTeksTakwim --- */
// Baris teks (PDF / perenggan Word): satu tarikh setiap baris; jika baris hanya ada tarikh, acara diambil daripada baris seterusnya
function huraiTeksTakwim(lines, thn) {
  const out = [];
  lines.forEach((l, i) => { const d = cariTarikh(l, thn); if (!d) return; let acara = bersihAcara(d.sisa);
    if (!acara && lines[i + 1] && !cariTarikh(lines[i + 1], thn)) acara = bersihAcara(lines[i + 1]);
    if (acara && acara.length > 2 && !/^(tarikh|date|hari|minggu)$/i.test(acara)) out.push({ tarikh: d.mula, tarikhTamat: d.akhir, acara: acara.slice(0, 200), unit: tekaKatTakwim(acara), tempat: '' }); });
  return out;
}

    // PDF berjadual (ada tajuk Tarikh & Aktiviti): baca ikut lajur; jika tidak, baca ikut baris teks
    const jadual = huraiBarisTakwim(lines.map(l => l.sel), thn); return jadual.length ? jadual : huraiTeksTakwim(lines.map(l => l.text), thn); }
  if (/\.(xlsx|xls|ods)$/.test(n)) { const X = await xlsxLib(), wb = X.read(new Uint8Array(await file.arrayBuffer()), { type: 'array', cellDates: false });
    // Tarikh Excel dibaca sebagai nombor siri (bukan objek Date) supaya tidak anjak sehari di zon waktu Malaysia.
    // Helaian PANDUAN / CONTOH / SENARAI (templat takwim) tidak dibaca.
    return wb.SheetNames.filter(sn => !/^\s*(PANDUAN|ARAHAN|CONTOH|SENARAI|PILIHAN|NOTA|_)/i.test(sn)).flatMap(sn => huraiBarisTakwim(X.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' }), thn)); }
  if (/\.(csv|tsv|txt)$/.test(n)) return huraiBarisTakwim(huraiCsv(await file.text()), thn);
  if (/\.docx$/.test(n)) {
    const M = await mammothLib(), buf = await file.arrayBuffer(), html = (await M.convertToHtml({ arrayBuffer: buf })).value, doc = new DOMParser().parseFromString(html, 'text/html'), out = [];
    doc.querySelectorAll('table').forEach(t => { out.push(...huraiBarisTakwim([...t.querySelectorAll('tr')].map(tr => [...tr.querySelectorAll('td,th')].map(td => td.textContent.replace(/\s+/g, ' ').trim())), thn)); t.remove(); });
    out.push(...huraiTeksTakwim([...doc.querySelectorAll('p,li,h1,h2,h3,h4')].map(p => p.textContent.replace(/\s+/g, ' ').trim()).filter(Boolean), thn));
    return out;
  }
  if (/\.doc$/.test(n)) throw new Error('Format Word lama (.doc) tidak disokong. Buka fail dalam Word dan Simpan Sebagai .docx atau PDF.');
  throw new Error('Format fail tidak disokong. Gunakan PDF, Word (.docx), Excel (.xlsx) atau CSV.');
}

// Templat Excel takwim koko: helaian TAKWIM (diisi), CONTOH dan PANDUAN (tidak dibaca semasa muat naik)
async function muatTurunTemplatTakwim() {
  const t = await act(() => call('templat', { jenis: 'takwim' })), X = await xlsxLib(), wb = X.utils.book_new();
  const lebar = [16, 16, 48, 22, 26].map(w => ({ wch: w }));
  const tk = X.utils.aoa_to_sheet([t.tajuk]); tk['!cols'] = lebar; X.utils.book_append_sheet(wb, tk, 'TAKWIM');
  const ct = X.utils.aoa_to_sheet([t.tajuk, ...t.rows]); ct['!cols'] = lebar; X.utils.book_append_sheet(wb, ct, 'CONTOH');
  const kat = KAT_TAKWIM.map(k => '   • ' + (KAT_KOD[k] && katNama(k) !== k ? katNama(k) + '  (' + k + ')' : k));
  const pd = X.utils.aoa_to_sheet([['PANDUAN · ' + t.nama], ...t.nota.map((x, i) => [(i + 1) + '. ' + x]), [''], ['Pilihan KATEGORI:'], ...kat.map(x => [x])]); pd['!cols'] = [{ wch: 110 }];
  X.utils.book_append_sheet(wb, pd, 'PANDUAN');
  try { X.writeFile(wb, t.nama + '.xlsx'); toast(t.nama + '.xlsx dimuat turun. Isi helaian TAKWIM, kemudian muat naik semula.'); } catch (e) { toast('Muat turun disekat oleh pelayar. Gunakan butang Templat Google Sheets.', true); }
}

/* --- e-Koko HalamanKoko.html · pct --- */
const pct = (a, b) => b ? Math.round(a / b * 1000) / 10 : 0;

/* --- e-Koko HalamanKoko.html · svgBar --- */
// Carta bar mendatar ringkas untuk kertas cetakan (warna tetap supaya jelas apabila dicetak)
function svgBar(cats, vals, { w = 520, warna = '#2a78d6', unit = '' } = {}) {
  const mx = Math.max(1, ...vals), rh = 22, lw = 150, h = cats.length * rh + 8;
  return `<svg class="cbar" viewBox="0 0 ${w} ${h}" role="img">${cats.map((c, i) => { const bw = Math.max(vals[i] ? 3 : 0, (w - lw - 50) * vals[i] / mx), y = 4 + i * rh;
    return `<text x="${lw - 6}" y="${y + 14}" text-anchor="end" font-size="10.5" fill="#14213d">${esc(c)}</text><rect x="${lw}" y="${y + 3}" width="${bw}" height="${rh - 8}" rx="3" fill="${Array.isArray(warna) ? warna[i % warna.length] : warna}"/><text x="${lw + bw + 5}" y="${y + 14}" font-size="10.5" font-weight="700" fill="#14213d">${vals[i]}${unit}</text>`; }).join('')}</svg>`;
}

/* --- e-Koko HalamanKoko.html · cetakHadirUnit --- */
function cetakHadirUnit(r) {
  const s = ST.boot.settings, P = r.perjumpaan, M = r.murid, purata = P.length ? Math.round(P.reduce((a, x) => a + x.peratus, 0) / P.length) : 0;
  const rendah = M.filter(x => x.peratus != null && x.peratus < 75), penuh = M.filter(x => x.peratus === 100), L = M.filter(x => !jantinaP(x.jantina)), Pr = M.filter(x => jantinaP(x.jantina));
  const avg = xs => xs.length && P.length ? Math.round(xs.reduce((a, x) => a + (x.peratus || 0), 0) / xs.length) : 0;
  const tinggi = P.slice().sort((a, b) => b.peratus - a.peratus)[0], rendahP = P.slice().sort((a, b) => a.peratus - b.peratus)[0];
  const ulasan = !P.length ? [`Belum ada perjumpaan direkod bagi ${esc(r.unit)} pada sesi ${esc(r.sesi)}. Guru penasihat perlu merekod kehadiran setiap perjumpaan di menu Kehadiran Koko.`] : [`Sebanyak <b>${P.length}</b> perjumpaan telah direkod bagi ${esc(r.unit)} pada sesi ${esc(r.sesi)} dengan purata kehadiran <b>${purata}%</b>${purata >= 85 ? ' (cemerlang)' : purata >= 75 ? ' (baik)' : ' (perlu dipertingkatkan)'}.`,
    P.length ? `Kehadiran tertinggi pada perjumpaan ke-${tinggi.perjumpaan} (${fmtD(tinggi.tarikh)}) iaitu <b>${tinggi.peratus}%</b>, manakala terendah pada perjumpaan ke-${rendahP.perjumpaan} (${fmtD(rendahP.tarikh)}) iaitu <b>${rendahP.peratus}%</b>.` : '',
    `<b>${penuh.length}</b> daripada ${M.length} ahli (${pct(penuh.length, M.length)}%) hadir pada semua perjumpaan.`,
    `Purata kehadiran ahli lelaki <b>${avg(L)}%</b> dan ahli perempuan <b>${avg(Pr)}%</b>.`,
    rendah.length ? `<b>${rendah.length}</b> ahli mempunyai kehadiran di bawah 75%. Guru penasihat disarankan menghubungi ibu bapa / guru kelas dan memantau kehadiran murid berkenaan.` : 'Tiada ahli dengan kehadiran di bawah 75%. Tahniah kepada semua ahli.'].filter(Boolean);
  const kol = P.map(x => `<th title="${fmtD(x.tarikh)}">P${esc(x.perjumpaan)}</th>`).join('');
  showPrint(paperHead('LAPORAN KEHADIRAN KOKURIKULUM', 'SESI ' + r.sesi) + `<div class="tt">LAPORAN KEHADIRAN ${esc(String(r.unit).toUpperCase())} (${esc(String(r.label).toUpperCase())})<br>${esc(s.namaSekolah.toUpperCase())} · SESI ${esc(r.sesi)}</div>
    <div class="kpis"><div><small>JUMLAH AHLI</small><b>${M.length}</b></div><div><small>PERJUMPAAN DIREKOD</small><b>${P.length}</b></div><div><small>PURATA KEHADIRAN</small><b>${purata}%</b></div><div><small>BAWAH 75%</small><b>${rendah.length}</b></div></div>
    <div class="sek"><h3>A. REKOD PERJUMPAAN</h3>${oprJadual([['Perjumpaan'], ['Tarikh'], ['Aktiviti'], ['Hadir', 1], ['%', 1], ['Direkod oleh']], P.map(x => ['Ke-' + esc(x.perjumpaan), fmtD(x.tarikh), esc(x.aktiviti || '-'), `${x.bilHadir}/${x.bilAhli}`, x.peratus + '%', esc(x.oleh || '')]), 'Belum ada perjumpaan direkod.')}</div>
    ${P.length ? `<div class="sek"><h3>B. PERATUS KEHADIRAN SETIAP PERJUMPAAN</h3>${svgBar(P.map(x => 'Perjumpaan ke-' + x.perjumpaan), P.map(x => x.peratus), { unit: '%', warna: P.map(x => x.peratus >= 75 ? '#12875a' : '#d13b3b') })}</div>` : ''}

/* --- e-Koko HalamanAdmin.html · ekNormT --- */
const ekNormT = h => String(h || '').toUpperCase().split('*').join('').replace(/\(.*?\)/g, '').replace(/[^A-Z0-9]/g, '');

/* --- e-Koko HalamanAdmin.html · huraiCsv --- */
function huraiCsv(teks) {
  teks = String(teks || '').replace(/^﻿/, '').trim(); if (!teks) throw new Error('Tampal data atau pilih fail .csv terlebih dahulu.');
  const b1 = teks.split(/\r?\n/)[0], sep = b1.includes('\t') ? '\t' : b1.includes(';') && !b1.includes(',') ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < teks.length; i++) { const c = teks[i];
    if (q) { if (c === '"') { if (teks[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; continue; }
    if (c === '"' && cell === '') q = true; else if (c === sep) { row.push(cell); cell = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && teks[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; } else cell += c; }
  row.push(cell); rows.push(row);
  return rows;
}

/* --- e-Koko HalamanKoko.html · capSusun --- */
const capSusun = k => { const lain = [...new Set(k.jadual.flatMap(j => Object.keys(j.pencapaian)))].filter(c => !PENCAPAIAN_KOKO.includes(c)); return [...PENCAPAIAN_KOKO.slice(0, 5), ...lain.filter(c => !/Saguhati|Penyertaan/.test(c)), 'Saguhati', 'Penyertaan']; };

/* --- e-Koko HalamanKoko.html · jumT --- */
const jumT = k => k.jadual.reduce((a, j) => { a.acara += j.acara; a.pasukan += j.pasukan; a.peserta += j.peserta; return a; }, { acara: 0, pasukan: 0, peserta: 0 });

/* --- e-Koko HalamanKoko.html · ulasanPencapaian --- */
function ulasanPencapaian(k) {
  const T = jumT(k), cap = capSusun(k), johan = k.jadual.reduce((a, j) => a + (j.pencapaian.Johan || 0), 0), atas = k.jadual.filter((j, i) => i >= 3).reduce((a, j) => a + j.acara, 0);
  const tinggi = PERINGKAT.slice().reverse().find(p => (k.jadual.find(j => j.peringkat === p) || {}).acara), L = k.lalu, beza = L.acara ? Math.round((T.acara - L.acara) / L.acara * 100) : null;
  const katTop = Object.keys(k.kategori).map(x => [x, Object.values(k.kategori[x]).reduce((a, b) => a + b, 0)]).sort((a, b) => b[1] - a[1])[0];
  const out = [`Sepanjang sesi ${esc(k.sesi)}, murid ${esc(ST.boot.settings.namaSekolah)} telah menyertai <b>${T.acara}</b> acara pertandingan (${T.pasukan} acara berpasukan, ${T.acara - T.pasukan} acara individu) melibatkan <b>${T.peserta}</b> penyertaan dan <b>${k.murid.unik}</b> murid berbeza${k.enrol ? ` (${pct(k.murid.unik, k.enrol)}% daripada enrolmen)` : ''}.`];
  if (T.acara) out.push(`Sebanyak <b>${johan}</b> gelaran johan (${pct(johan, T.acara)}% daripada acara) dan <b>${k.jadual.reduce((a, j) => a + cap.slice(0, 3).reduce((s, c) => s + (j.pencapaian[c] || 0), 0), 0)}</b> kedudukan tiga terbaik telah diraih.`);
  if (tinggi) out.push(`Peringkat pencapaian tertinggi ialah peringkat <b>${esc(tinggi)}</b>. ${atas} acara (${pct(atas, T.acara)}%) disertai pada peringkat negeri dan ke atas.`);
  if (katTop) out.push(`Kategori paling aktif ialah <b>${esc(katNama(katTop[0]))}</b> dengan ${katTop[1]} acara.`);
  if (k.unit[0]) out.push(`Unit / acara paling aktif: ${k.unit.slice(0, 3).map(u => `<b>${esc(u.unit)}</b> (${u.acara} acara${u.johan ? ', ' + u.johan + ' johan' : ''})`).join(', ')}.`);
  if (beza != null) out.push(`Berbanding sesi ${esc(L.sesi)} (${L.acara} acara, ${L.murid} murid), bilangan acara ${beza >= 0 ? `<b>meningkat ${beza}%</b>` : `<b>menurun ${Math.abs(beza)}%</b>`}.`);
  return out;
}

/* --- e-Koko HalamanKoko.html · cadanganPencapaian --- */
function cadanganPencapaian(k) {
  const T = jumT(k), L = k.lalu, out = [];
  const atas = k.jadual.filter((j, i) => i >= 3).reduce((a, j) => a + j.acara, 0);
  if (k.enrol && pct(k.murid.unik, k.enrol) < 30) out.push('Penyertaan murid dalam pertandingan masih rendah. Perluaskan pemilihan atlet / peserta melalui pertandingan peringkat sekolah dan rumah sukan.');
  if (T.acara && pct(atas, T.acara) < 20) out.push('Tingkatkan latihan berfokus bagi acara yang berpotensi mara ke peringkat negeri dan kebangsaan.');
  if (L.acara && T.acara < L.acara) out.push('Bilangan penyertaan menurun berbanding sesi lalu. Kenal pasti punca (jadual, kos, jurulatih) dan rancang penyertaan lebih awal dalam takwim koko.');
  const tiada = Object.keys(KOKO_KATEGORI.reduce((a, c) => (a[c] = 1, a), {})).filter(c => !k.kategori[c]);
  if (tiada.length) out.push(`Tiada pencapaian direkod bagi kategori ${tiada.map(x => esc(katNama(x))).join(', ')}. Galakkan unit berkenaan menyertai pertandingan luar.`);
  out.push('Teruskan pengiktirafan murid berjaya melalui perhimpunan, papan kenyataan dan media sosial sekolah bagi memupuk minat murid lain.');
  return out;
}

    const ct = q('#rpCet'); if (ct) ct.onclick = () => cetakRpt(f, rows, d.status);
  };
  draw();
}

      .sort((a, b) => String(a.kelas).localeCompare(b.kelas) || String(a.nama).localeCompare(b.nama));
    cetakMurid(xs, { kelas: f.kelas, sesi: f.sesi === '-' ? '__x' : f.sesi }, [['unitB', katNama('UB')], ['kelab', katNama('KP')], ['sukan', katNama('SP')], ['rumah', katNama('RS')]], duaSesi()); }; };
// Data Profil Murid: rekod kokurikulum dari tahun ke tahun (unit, jawatan, kehadiran, pencapaian)

<script>
/* HalamanPeperiksaan.html — Kurikulum › Peperiksaan
   Data dibaca daripada Sistem Pengurusan Peperiksaan (SPP) melalui dataPeperiksaan() dalam Peperiksaan.gs.
   Menu didaftarkan di bawah Kurikulum (selepas Enrolmen Murid), jadi Klien.html tidak perlu diubah.
   Jika sambungan SPP belum ditetapkan (atau Peperiksaan.gs tiada), widget terbina dalam (Tetapan widget) dipaparkan. */
IC.exam = '<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12l1.5 1.5L14 11M10 17h5"/>';
(function () {
  const g = NAV.find(x => x.g === 'Kurikulum');
  if (!g || g.items.some(i => i[0] === 'peperiksaan')) return;
  const i = g.items.findIndex(x => x[0] === 'enrolmen');
  g.items.splice(i >= 0 ? i + 1 : g.items.length, 0, ['peperiksaan', 'Peperiksaan', 'exam', '#d9480f']);
})();

const PPX_WARNA = ['#2f9e44', '#74b816', '#1c7ed6', '#f59f00', '#f76707', '#e03131', '#7048e8', '#868e96'];
const PPX_STATUS = { DIBUKA: ['Isian dibuka', 'warn'], DITUTUP: ['Isian ditutup', 'warn'], MUKTAMAD: ['Muktamad', 'acc'] };
const ppxNama = p => String(p.nama).indexOf(p.tahun) >= 0 ? p.nama : p.nama + ' ' + p.tahun;
const ppxV = (x, s = '') => x == null ? '-' : x + s;
/* Widget terbina dalam (Halaman3) disimpan sebagai sandaran */
const PPX_WIDGET = PAGES.peperiksaan;

function dataPeperiksaanSekali(segar) {
  return new Promise((res, rej) => {
    if (MODE !== 'gas') return rej(Object.assign(new Error('Menu Peperiksaan memaparkan data daripada Sistem Pengurusan Peperiksaan dan hanya berfungsi dalam sistem sebenar.'), { belumSet: true }));
    if (!google.script.run.dataPeperiksaan) return rej(Object.assign(new Error('Fail Peperiksaan.gs tiada.'), { belumSet: true }));
    google.script.run
      .withSuccessHandler(o => (o && o.ok ? res(o.data) : rej(Object.assign(new Error(o ? o.ralat : 'Tiada respons daripada pelayan.'), { belumSet: !!(o && o.belumSet) }))))
      .withFailureHandler(e => rej(new Error(e && e.message ? e.message : String(e))))
      .dataPeperiksaan(ST.token, !!segar);
  });
}
/* Cuba semula automatik jika sambungan Google terputus seketika */
async function dataPeperiksaanSPP(segar) {
  for (let i = 0; ; i++) {
    try { return await dataPeperiksaanSekali(segar); }
    catch (e) { if (i < 2 && typeof RALAT_SAMBUNG !== 'undefined' && RALAT_SAMBUNG.test(e.message || '')) { await new Promise(r => setTimeout(r, 800 * (i + 1))); continue; } throw e; }
  }
}

PAGES.peperiksaan = async (m, segar) => {
  let d;
  try { d = await dataPeperiksaanSPP(segar); }
  catch (e) { if (e.belumSet && PPX_WIDGET) return PPX_WIDGET(m); toast(e.message || String(e), true); throw e; }
  ST.ppxData = d;
  ppxLukis(m);
};

function ppxLukis(m) {
  const d = ST.ppxData, ps = d.peperiksaan || [];
  if (!ps.length) {
    m.innerHTML = head('Peperiksaan', 'Analisis peperiksaan daripada Sistem Pengurusan Peperiksaan (SPP)') +
      '<div class="card"><div class="empty">Belum ada data peperiksaan dikongsi. Superadmin SPP perlu memilih peperiksaan di SPP › Tetapan › Paparan di Dashboard Utama Sekolah.</div></div>';
    return;
  }
  if (!ps.some(p => p.id === ST.ppxPilih)) ST.ppxPilih = ps[0].id;
  const p = ps.find(x => x.id === ST.ppxPilih), st = PPX_STATUS[p.status] || [p.status, ''], w = d.widget || [];
  const kanan = `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${sel('ppxPilih', ps.map(x => [x.id, ppxNama(x)]), ST.ppxPilih)}<button class="btn" id="ppxSegar">${ico('refresh')}Muat semula</button></div>`;
  let h = head('Peperiksaan', `${esc(ppxNama(p))} ${chip(st[0], st[1])}`, kanan);

  if (p.kad) {
    h += `<div class="card"><div class="ppx-tiles">${[['Calon', ppxV(p.kad.calon)], ['GPS', ppxV(p.kad.gps)], ['Purata', ppxV(p.kad.purata)], ['Lulus', ppxV(p.kad.lulusPct, '%')], ['Lulus semua', ppxV(p.kad.lulusSemuaPct, '%')], ['Tidak hadir', ppxV(p.kad.thPct, '%')]]
      .map(x => `<div class="ppx-tile"><b>${esc(x[1])}</b><span>${x[0]}</span></div>`).join('')}</div>
      <p class="ppx-nota">GPS (Gred Purata Sekolah): semakin rendah semakin baik. Murid tidak hadir tidak dikira dalam GPS, purata dan peratus lulus.</p></div>`;
  }
  if (p.isian) {
    h += `<div class="card" style="margin-top:14px"><b>Pengisian markah oleh guru subjek: ${p.isian.hantar}/${p.isian.daftar} (${p.isian.pct}%)</b><div class="ppx-bar"><i style="width:${Math.min(100, p.isian.pct)}%"></i></div></div>`;
  }

  h += '<div class="ppx-grid">';
  if (w.includes('TREND') && ps.length > 1) h += '<div class="card"><h3 class="ppx-h">Trend GPS antara peperiksaan</h3><div id="ppxTrend"></div><p class="ppx-nota">Bar lebih rendah = prestasi lebih baik.</p></div>';
  if (p.subjek) h += '<div class="card"><h3 class="ppx-h">GPMP ikut subjek</h3><div id="ppxGpmp"></div></div>';
  if (p.gred) h += `<div class="card"><h3 class="ppx-h">Taburan gred ikut subjek (bil. calon)</h3><div id="ppxGred"></div><div class="ppx-leg">${p.gred.label.map((l, i) => `<span><i style="background:${PPX_WARNA[i]}"></i>${esc(l)}</span>`).join('')}</div></div>`;
  if (p.subjek) {
    h += `<div class="card"><h3 class="ppx-h">Prestasi subjek</h3><div class="ppx-t"><table><thead><tr><th>Subjek</th><th>GPMP</th><th>% Lulus</th><th>Purata</th></tr></thead><tbody>
      ${p.subjek.map(s => `<tr><td>${esc(s.nama)}</td><td class="n">${ppxV(s.gpmp)}</td><td class="n">${ppxV(s.lulusPct)}</td><td class="n">${ppxV(s.purata)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  if (p.kelas) {
    h += `<div class="card"><h3 class="ppx-h">Prestasi ikut kelas</h3><div class="ppx-t"><table><thead><tr><th>Kelas</th><th>GP Kelas</th><th>% Lulus</th><th>% Lulus semua subjek</th></tr></thead><tbody>
      ${p.kelas.map(k => `<tr><td>${esc(k.kelas)}</td><td class="n">${ppxV(k.gp)}</td><td class="n">${ppxV(k.lulusPct)}</td><td class="n">${ppxV(k.lulusSemuaPct)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  (p.top || []).forEach(t => {
    h += `<div class="card"><h3 class="ppx-h">5 murid terbaik ${esc(t.aliran)}</h3><div class="ppx-t"><table><thead><tr><th>#</th><th>Nama</th><th>Kelas</th><th>Purata</th><th>Keputusan</th></tr></thead><tbody>
      ${t.murid.map(x => `<tr><td class="n">${x.rank}</td><td>${esc(x.nama)}</td><td>${esc(x.kelas)}</td><td class="n">${ppxV(x.purata)}</td><td>${esc(x.keputusan)}</td></tr>`).join('')}</tbody></table></div></div>`;
  });
  h += `</div><p class="ppx-nota">Sumber: Sistem Pengurusan Peperiksaan &middot; dikemas kini ${esc(d.dikemaskini)}</p>`;
  m.innerHTML = h;

  $('#ppxPilih').onchange = e => { ST.ppxPilih = e.target.value; ppxLukis(m); };
  $('#ppxSegar').onclick = async () => { try { await PAGES.peperiksaan(m, true); } catch (e) { } };
  if (w.includes('TREND') && ps.length > 1) {
    const tr = ps.slice().reverse();
    bars($('#ppxTrend'), tr.map(ppxNama), [{ name: 'GPS', vals: tr.map(x => (x.kad && x.kad.gps) || 0), color: '#2f6fed' }], 220);
  }
  if (p.subjek) bars($('#ppxGpmp'), p.subjek.map(s => s.kod), [{ name: 'GPMP', vals: p.subjek.map(s => s.gpmp || 0), color: '#2f6fed' }], 240);
  if (p.gred) bars($('#ppxGred'), p.gred.subjek.map(s => s.kod), p.gred.label.map((l, i) => ({ name: l, vals: p.gred.subjek.map(s => s.g[l] || 0), color: PPX_WARNA[i] })), 260);
}
</script>

<script>

if (store.get('lp_mini') === '1') $('#app').classList.add('mini');

if (sesiLuput()) { ST.token = null; store.set('lp_token', null); }

function mulaSistem(kali) {

    const m = esc(e.message || e), sambung = e.sambung || /NetworkError|Connection|HTTP/i.test(e.message || '');
    $('#main').innerHTML = `<div class="card" style="max-width:680px;margin:30px auto"><h3 style="margin:0 0 8px">${ico('alert')} Laman tidak dapat dimuatkan</h3><div class="note" style="margin-bottom:12px;font-family:monospace;font-size:12.5px">${m}</div>
      <ol style="line-height:1.7;margin:0 0 14px;padding-left:20px">${sambung ? '<li>Semak sambungan internet, kemudian tekan <b>Cuba semula</b>.</li><li>Jika anda log masuk beberapa akaun Google dalam pelayar yang sama, buka laman dalam <b>tetingkap Incognito / Private</b> atau log keluar akaun Google lain.</li><li>Matikan sementara extension penyekat iklan (ad blocker) bagi laman ini.</li>' : ''}<li>Pentadbir: dalam editor Apps Script, jalankan fungsi <b>ujiSistem</b> dan semak <i>Execution log</i>.</li><li>Selepas mengemas kini kod: <b>Deploy › Manage deployments › Edit › New version</b>.</li></ol>

    $('#bootUlang').onclick = () => mulaSistem(1);
